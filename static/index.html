<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>教学排课管理系统</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23185FA5'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23fff' font-family='sans-serif'%3E%E8%AF%BE%3C/text%3E%3C/svg%3E"/>
<style>
:root{--primary:#185FA5;--bg:#f5f7fa;--side:#1f2937;--side-active:#185FA5;--border:#e4e7ed;--text:#1f2329;}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
a{color:inherit;text-decoration:none;cursor:pointer;}
.login-wrap{height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#185FA5,#0c447c);}
.login-card{background:#fff;padding:32px 28px;border-radius:12px;width:340px;box-shadow:0 8px 30px rgba(0,0,0,.15);}
.login-card h2{margin:0 0 20px;color:var(--primary);text-align:center;}
.input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:14px;font-size:14px;}
.btn{display:inline-block;padding:9px 16px;border:none;border-radius:8px;background:var(--primary);color:#fff;cursor:pointer;font-size:14px;}
.btn:hover{opacity:.9;}
.btn-block{width:100%;}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--primary);}
.layout{display:flex;height:100vh;overflow:hidden;}
.sidebar{width:220px;flex-shrink:0;background:var(--side);color:#cbd5e1;display:flex;flex-direction:column;transition:margin-left .2s ease;}
.sidebar.collapsed{margin-left:-220px;}
.logo{padding:18px 16px;color:#fff;font-weight:600;font-size:15px;border-bottom:1px solid #334155;}
.menu{padding:8px 0;overflow:auto;flex:1;}
.menu-title{padding:10px 16px 6px;font-size:12px;color:#94a3b8;cursor:pointer;display:flex;align-items:center;justify-content:space-between;letter-spacing:.08em;user-select:none;transition:color .15s,background .15s;}
.menu-title:hover{color:#e2e8f0;background:rgba(255,255,255,.05);}
.menu-title.on{color:#7dd3fc;}
.menu-title .chev{font-size:10px;transition:transform .15s ease;transform-origin:center;}
.menu-title .chev.closed{transform:rotate(-90deg);}
.menu-item{padding:10px 16px;cursor:pointer;color:#cbd5e1;display:block;}
.menu-item:hover{background:#334155;color:#fff;}
.help-link{flex:none;margin:10px;padding:9px 12px;border-top:1px solid rgba(255,255,255,.14);border-radius:6px;color:#9fc3e8;font-size:12.5px;text-decoration:none;text-align:center;letter-spacing:1px;}
.help-link:hover{background:#334155;color:#fff;}
.menu-item.active{background:var(--side-active);color:#fff;border-left:3px solid #7dd3fc;}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;}
.topbar .user{font-size:13px;color:#475569;}
.content{padding:18px;overflow:auto;flex:1;}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px;}
.card h3{margin:0 0 14px;font-size:15px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;}
.stat{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center;}
.stat .num{font-size:26px;font-weight:600;color:var(--primary);}
.stat .label{color:#64748b;margin-top:6px;font-size:13px;}
table{width:100%;border-collapse:collapse;background:#fff;}
th,td{padding:10px 12px;border-bottom:1px solid var(--border);text-align:left;font-size:13px;}
th{background:#f8fafc;color:#475569;font-weight:500;}
tr:hover td{background:#f8fafc;}
tr.picked td{background:#eef6ff;}
tr.picked:hover td{background:#e3efff;}
td.chk,th.chk{width:36px;padding-right:0;cursor:pointer;}
td.chk input,th.chk input{cursor:pointer;width:15px;height:15px;vertical-align:middle;}
.selbar{display:flex;gap:10px;align-items:center;margin:-4px 0 12px;padding:8px 12px;background:#eef6ff;border:1px solid #cfe3fb;border-radius:8px;font-size:13px;color:#1e4e79;}
.imp-pick-list{max-height:300px;overflow:auto;border:1px solid #d8e2ef;border-radius:8px;margin-bottom:8px;background:#fff;}
.imp-pick-item{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:13px;cursor:pointer;border-bottom:1px solid #f0f4f9;}
.imp-pick-item:last-child{border-bottom:none;}
.imp-pick-item:hover{background:#f2f7fd;}
.imp-pick-item.dis{color:#98a6b5;cursor:not-allowed;}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:#e6f1fb;color:#185FA5;font-size:12px;}
.tag.amber{background:#faedda;color:#854f0b;}
.tag.green{background:#e6f3ee;color:#0f6e56;}
.tag.purple{background:#f1ebfd;color:#6941C6;}
.toolbar{margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.dialog-mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;}
.dialog{background:#fff;border-radius:12px;padding:22px;width:420px;max-width:92vw;}
.dialog h3{margin:0 0 16px;}
.field{margin-bottom:12px;}
.imp-dialog{width:96vw;max-width:1120px;max-height:92vh;display:flex;flex-direction:column;padding:18px 20px;}
.imp-body{overflow:auto;flex:1;margin:6px 0 10px;border:1px solid var(--border);border-radius:8px;}
.imp-body table{font-size:12px;}
.imp-body th{position:sticky;top:0;z-index:1;}
.imp-body td{padding:7px 10px;}
.imp-msg{max-height:120px;overflow:auto;font-size:12px;line-height:1.7;padding:8px 12px;border-radius:8px;margin-bottom:8px;}
.imp-msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;}
.imp-msg.warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a;}
.imp-msg.info{background:#f0f7ff;color:#1e3a5f;border:1px solid #c9d8ee;}
.imp-stats{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;color:#475569;margin-bottom:8px;}
.imp-stats b{color:var(--primary);font-size:15px;}
.act-new{color:#0f6e56;}
.act-upd{color:#854f0b;}
/* 可输入筛选的人员选择器 */
.pp{position:relative;display:inline-flex;align-items:center;width:100%;}
.pp-input{width:100%;min-height:32px;padding:5px 22px 5px 9px;margin:0;font-size:13px;}
.pp-caret{position:absolute;right:9px;pointer-events:none;color:#94a3b8;font-size:10px;}
.pp-list{position:absolute;top:100%;left:0;right:0;z-index:60;background:#fff;border:1px solid #c7d2dd;border-radius:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:220px;overflow:auto;margin-top:2px;text-align:left;}
.pp-item{padding:7px 10px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center;line-height:1.35;}
.pp-item:hover{background:#eef6ff;}
.pp-item b{font-weight:500;color:var(--text);}
.pp-note{color:#0f6e56;font-size:11px;}
.pp-sub{color:#94a3b8;font-size:11px;margin-left:auto;}
.pp-none{padding:8px 10px;font-size:12px;color:#94a3b8;}
.pp-none-item{color:#475569;border-bottom:1px dashed var(--border);}
.field label{display:block;margin-bottom:5px;color:#475569;font-size:13px;}
.switch{display:inline-flex;gap:14px;}
.muted{color:#94a3b8;font-size:12px;}
.banner{margin:0 0 14px;padding:10px 14px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:10px;border:1px solid;}
.banner-info{background:#eff6ff;border-color:#bfdbfe;color:#1e40af;}
.banner-ok{background:#ecfdf5;border-color:#a7f3d0;color:#065f46;}
.banner-warn{background:#fffbeb;border-color:#fde68a;color:#92400e;}
.banner-err{background:#fef2f2;border-color:#fecaca;color:#991b1b;}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.session{border:1px solid var(--border);border-radius:10px;padding:12px;background:#fff;}
.session .date{font-weight:600;margin-bottom:8px;color:#0c447c;}
.slot{border-top:1px dashed var(--border);padding:10px 0;}
.slot-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.slot .type{font-weight:500;}
.role-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.role-cell label{display:block;font-size:12px;color:#475569;margin-bottom:3px;}
.role-cell select{width:100%;}
.equal-teacher{font-size:13px;color:#0c447c;background:#e6f1fb;border:1px dashed #185FA5;border-radius:6px;padding:7px 10px;}
.warn{color:#c0392b;font-size:12px;margin-top:6px;}
.roles{font-size:12px;color:#475569;margin-top:4px;}
select.input{padding:6px 8px;height:auto;min-height:38px;line-height:1.35;}
.weeks{display:flex;flex-direction:column;gap:14px;}
.week{background:#fff;border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.week-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.week-head .wk{font-weight:600;color:#0c447c;}
.week-head .dt{color:#64748b;font-size:13px;}
.slots-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.slot{border:1px solid var(--border);border-radius:8px;padding:10px;background:#fbfdff;}
.wk-date{width:170px;}
.fb-card{margin-top:14px;}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:0 18px;}
.rules-grid .field{margin-bottom:10px;}
/* 课型序列标签编辑器 */
.seq-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px;}
.seq-chip{display:inline-flex;align-items:center;gap:2px;background:#eef3fb;border:1px solid #c9d8ee;border-radius:14px;padding:2px 4px 2px 10px;font-size:13px;color:#1e3a5f;}
.seq-chip.seq-first{background:#dbeafe;border-color:#93b4e0;font-weight:600;}
.seq-btn{border:none;background:transparent;cursor:pointer;font-size:11px;color:#3b6db4;padding:2px 3px;line-height:1;border-radius:4px;}
.seq-btn:hover{background:#d7e4f6;}
.seq-btn:disabled{opacity:.25;cursor:default;background:transparent;}
.seq-btn.seq-x{color:#b4564b;font-size:13px;}
.seq-add{display:inline-flex;align-items:center;gap:4px;}
.seq-sel{width:auto;min-width:96px;padding:3px 6px;font-size:12px;height:auto;}
.seq-btn-add{padding:2px 8px;font-size:12px;}
.wd-group{display:flex;gap:6px;flex-wrap:wrap;}
.wd-chip{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--border);
  border-radius:16px;cursor:pointer;user-select:none;font-size:13px;line-height:1.2;transition:all .15s;}
.wd-chip input{margin:0;accent-color:var(--primary,#2563eb);}
.wd-chip:hover{border-color:var(--primary,#2563eb);}
.wd-chip.on{background:var(--primary,#2563eb);color:#fff;border-color:var(--primary,#2563eb);}
.wd-chip.on input{accent-color:#fff;}
.pair{display:flex;gap:8px;}
.pair .input{min-width:0;}
.fb-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.fb-head h3{margin:0;font-size:15px;}
.fb-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--border);flex-wrap:wrap;}
.fb-row .fb-sel{width:auto;min-width:180px;flex:0 0 auto;max-width:100%;}
.fb-row .fb-note{width:300px;flex:0 0 auto;max-width:100%;}
.menu-toggle{display:inline-block;padding:4px 10px;margin-right:8px;}
.exam-flex{display:flex;gap:12px;align-items:flex-start;}
.exam-side{flex-shrink:0;width:400px;}
.exam-side.mid{width:330px;}
.exam-side.narrow{width:290px;}
.sidebar-mask{display:none;}
@media (max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s;z-index:200;width:200px;margin-left:0;}
  .sidebar.open{transform:translateX(0);}
  .sidebar.collapsed{margin-left:0;}
  .menu-toggle{display:inline-block;padding:4px 10px;margin-right:8px;}
  .content{padding:12px;}
  .slots-row{grid-template-columns:1fr;}
  .role-grid{grid-template-columns:1fr;}
  .fb-row .fb-sel,.fb-row .fb-note{width:100%;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .topbar{padding:0 12px;}
  .exam-flex{flex-direction:column;}
  .exam-side,.exam-side.narrow,.exam-side.mid{width:auto;}
  .card{overflow-x:auto;}
  .sidebar-mask{display:block;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:150;}
  .topbar .user{font-size:12px;}
}
@media print{
  .sidebar,.topbar,.toolbar,.menu-toggle{display:none !important;}
  .content{overflow:visible !important;padding:0 !important;}
  .main{display:block;}
  .week{break-inside:avoid;margin-bottom:10px;}
  body{background:#fff;}
}
/* ===== 技能考核考务 ===== */
.exam-board{overflow:auto;max-height:64vh;border-top:1px solid var(--border);}
.exam-board table{border-collapse:separate;border-spacing:0;font-size:12px;}
.exam-board th,.exam-board td{border-right:1px solid #eef0f3;border-bottom:1px solid #eef0f3;padding:0;height:30px;}
.exam-board th{background:#f8fafc;color:#475569;font-weight:500;padding:5px 6px;position:sticky;top:0;z-index:3;white-space:nowrap;font-size:11px;}
.exam-board td.name{position:sticky;left:0;background:#fff;z-index:2;padding:4px 8px;min-width:150px;border-right:1px solid var(--border);}
.exam-board td.name .g{color:#94a3b8;font-size:11px;margin-left:4px;}
.exam-board .cell{text-align:center;font-size:11px;font-weight:500;color:#1f2329;}
.exam-board .empty{background:repeating-linear-gradient(45deg,#fbfcfd,#fbfcfd 6px,#f4f6f8 6px,#f4f6f8 12px);}
.st-grid{display:grid;grid-template-columns:16px 1fr 46px 36px 36px 30px;gap:6px;align-items:center;padding:5px 6px;border:1px solid var(--border);border-left:4px solid #ccc;border-radius:7px;margin-bottom:6px;}
.st-grid.off{opacity:.45;}
.st-grid input[type=number],.st-grid input[type=text]{width:100%;padding:3px 5px;font-size:12px;text-align:center;}
.st-hd{display:grid;grid-template-columns:16px 1fr 46px 36px 36px 30px;gap:6px;padding:0 7px 4px;color:#94a3b8;font-size:11px;}
.chip{border:1px solid var(--border);border-radius:14px;padding:3px 10px;cursor:pointer;user-select:none;background:#fff;font-size:12px;display:inline-block;margin:0 6px 6px 0;}
.chip.on{background:#e8f1f9;border-color:var(--primary);color:var(--primary);}
.chip.off{opacity:.4;cursor:not-allowed;}
.stu-row{display:grid;grid-template-columns:118px 46px auto;align-items:center;gap:8px;padding:3px 6px;border-radius:5px;}
.stu-row:hover{background:#f8fafc;}
.stu-row label{cursor:pointer;display:flex;align-items:center;gap:6px;min-width:0;}
.stu-row label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stu-row .grp{font-size:11px;color:#94a3b8;}
.mini-st{display:inline-flex;gap:3px;align-items:center;}
.mini-st span{width:18px;height:18px;border-radius:4px;border:1px solid #e2e8f0;background:#f1f5f9;font-size:10px;line-height:16px;text-align:center;color:#a8b3c0;cursor:pointer;transition:.12s;}
.mini-st span:hover{transform:translateY(-1px);box-shadow:0 1px 3px rgba(15,23,42,.15);}
.mini-st span.on{border-color:transparent;color:#fff;font-weight:700;}
.mini-st span.off2{text-decoration:line-through;}
.stat-line{display:flex;gap:18px;flex-wrap:wrap;padding:9px 14px;background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:12px;font-size:12px;color:#64748b;}
.stat-line b{color:var(--primary);font-size:15px;margin-right:3px;}
/* 技能考核四步流程 */
.steps{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap;}
.step{padding:6px 14px;border:1px solid var(--border);border-radius:20px;background:#fff;color:#64748b;cursor:pointer;font-size:13px;user-select:none;}
.step i{font-style:normal;font-weight:700;margin-right:4px;}
.step.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.step.done{background:#e8f1f9;border-color:#c7ddf0;color:var(--primary);}
.sum-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:13px;}
.sum-row b{margin-left:auto;color:var(--primary);}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:0 0 auto;}
.st2{border:1px solid var(--border);border-left:4px solid #ccc;border-radius:8px;padding:7px 8px;margin-bottom:7px;}
.st2.off{opacity:.45;}
.st2-top{display:flex;align-items:center;gap:6px;}
.st2-top input[type=text]{flex:1;min-width:0;padding:3px 6px;font-size:12px;}
.st2-top input[type=color]{width:28px;height:22px;padding:0;border:1px solid var(--border);border-radius:5px;background:#fff;cursor:pointer;flex:0 0 auto;}
.st2-line{display:flex;gap:12px;align-items:center;margin-top:5px;color:#475569;font-size:12px;}
.st2-line input[type=text]{flex:1;min-width:0;padding:3px 6px;font-size:12px;}
.cap-row{padding:7px 0;border-bottom:1px dashed var(--border);}
.cap-name{display:flex;align-items:center;gap:6px;font-size:13px;}
.cap-ctl{display:flex;gap:16px;align-items:center;margin-top:5px;font-size:12px;color:#475569;flex-wrap:wrap;}
.cap-tea{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:5px;font-size:12px;color:#475569;}
.cap-tea .tname{background:#eef4fb;border:1px solid #cfe0f0;border-radius:10px;padding:1px 7px;color:#1e4e79;}
.cap-tea .tname .x{color:#94a3b8;margin-left:4px;text-decoration:none;cursor:pointer;}
.cap-tea .tname .x:hover{color:#c0392b;}
.cap-tea .lnk{margin-left:auto;color:var(--primary);cursor:pointer;font-size:11px;}
.tea-chips{display:flex;flex-wrap:wrap;gap:0;margin-top:6px;padding:6px;background:#f8fafc;border-radius:6px;max-height:118px;overflow:auto;}
.tea-chips .chip{margin:0 4px 4px 0;}
.tea-chips .chip.dim{opacity:.42;}
.chip i.h{font-style:normal;font-size:10px;color:#b45309;margin-left:3px;}
.tea-list{max-height:250px;overflow:auto;padding:2px 0 4px;}
.tea-row{padding:6px 12px;border-bottom:1px dashed var(--border);}
.tea-row:last-child{border-bottom:0;}
.tea-row.on{background:#f5faff;}
.tea-main{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;flex-wrap:wrap;}
.tea-main b{font-weight:600;}
.badge{font-size:10px;border-radius:8px;padding:1px 6px;border:1px solid transparent;}
.badge.b-rec{background:#e8f7ee;color:#137a43;border-color:#bfe6cf;}
.badge.b-ok{background:#f1f5f9;color:#475569;border-color:#e2e8f0;}
.badge.b-busy{background:#fdf2e3;color:#b45309;border-color:#f5dcb8;}
.tea-main .lv{font-size:11px;color:#c0392b;}
.tea-main .now{font-size:11px;color:var(--primary);background:#eef4fb;border-radius:8px;padding:1px 6px;}
.tea-hist{font-size:11px;color:#7b8794;margin-top:2px;line-height:1.7;}
.tea-hist .m{margin-right:8px;color:#64748b;}
.tea-hist .sum{color:#94a3b8;}
.tea-hist.none{color:#137a43;}
.exam-duty td.duty-td{position:relative;cursor:pointer;}
.exam-duty td.duty-td:hover{background:#f8fafc;}
.duty-pop{position:absolute;left:0;top:100%;z-index:30;background:#fff;border:1px solid var(--border);
  box-shadow:0 8px 24px rgba(15,23,42,.14);border-radius:8px;padding:8px 10px;min-width:250px;max-height:250px;overflow:auto;text-align:left;}
.duty-pop .dp-hd{font-size:11px;color:#64748b;margin-bottom:5px;}
.duty-pop label{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0;cursor:pointer;color:#334155;}
.duty-pop label.off{opacity:.5;cursor:not-allowed;}
.duty-pop .dp-ft{text-align:right;font-size:11px;margin-top:4px;}
.duty-pop .dp-ft a{color:var(--primary);cursor:pointer;}
.stepper{display:inline-flex;align-items:center;gap:5px;}
.stepper button{width:22px;height:22px;line-height:1;border:1px solid var(--border);background:#fff;border-radius:5px;cursor:pointer;color:#334155;}
.stepper button:hover{background:#f1f5f9;}
.stepper span{min-width:20px;text-align:center;font-weight:700;color:#1f2329;}
.exam-board td.editable{cursor:pointer;}
.exam-board td.editable:hover{outline:2px solid #185FA5;outline-offset:-2px;}
.exam-board td{position:relative;}

<body>
<div id="app"></div>
<script src="vendor/vue.global.prod.js"></script>
<script src="vendor/axios.min.js"></script>
<script>
  // 本地依赖加载失败时回退到 CDN（离线/内网环境优先走本地）
  if (!window.Vue) { document.write('<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"><\/script>'); }
  if (!window.axios) { document.write('<script src="https://unpkg.com/axios/dist/axios.min.js"><\/script>'); }
</script>
<script>
const { createApp, ref, reactive, computed, onMounted, watch } = Vue;

// 全局登录态：App 登录后写入角色，各页面组件据此隐藏管理员专属操作
const AuthState = reactive({ role: '' });
const useIsAdmin = () => computed(() => AuthState.role === 'admin');
// 仅管理员可访问的页面（与后端 api.ADMIN_MENUS 保持一致）
const ADMIN_ROUTES = ['classtypes', 'holidays', 'rules', 'dingtalk', 'menus', 'users'];
// 教务页面：管理员/教务可用，教师/学生访问时回工作台（与后端 api.STAFF_MENUS 一致）
const STAFF_ROUTES = ['teachers', 'students', 'schedule-generate', 'exam'];

const http = axios.create({ baseURL: '/api' });
http.interceptors.request.use(cfg => {
  const t = localStorage.getItem('token');
  if (t) cfg.headers.Authorization = 'Bearer ' + t;
  return cfg;
});
http.interceptors.response.use(r => r, err => {
  const url = String((err.config && err.config.url) || '');
  if (err.response && err.response.status === 401 && url.indexOf('/auth/login') === -1) {
    localStorage.removeItem('token');
    // 通知 App 立即切回登录页（否则会停在主界面：菜单空、数据 0、按钮无响应）
    window.dispatchEvent(new CustomEvent('auth-expired'));
    location.hash = '#/login';
  }
  return Promise.reject(err);
});

function routeKey() {
  let h = location.hash || '#/dashboard';
  h = h.replace(/^#\/?/, '');
  return h.split('/')[0] || 'dashboard';
}

const Login = {
  template: `
  <div class="login-wrap">
    <div class="login-card">
      <h2>教学排课管理系统</h2>
      <input class="input" name="login-username" v-model="username" placeholder="教师工号 / 学生学号 / 管理员账号"/>
      <input class="input" name="login-password" type="password" v-model="password" placeholder="密码" @keyup.enter="doLogin"/>
      <button class="btn btn-block" @click="doLogin">登 录</button>
      <div class="muted" v-if="notice" style="margin-top:12px;text-align:center;color:#c0392b;">{{ notice }}</div>
      <div class="muted" style="margin-top:12px;text-align:center;">教师用工号、学生用学号登录，初始密码 123456</div>
    </div>
  </div>`,
  props: ['notice'],
  setup(props, { emit }) {
    const username = ref('');
    const password = ref('');
    function doLogin() {
      const fd = new URLSearchParams();
      fd.append('username', username.value);
      fd.append('password', password.value);
      http.post('/auth/login', fd, { headers: { 'Content-Type': 'application/x-www-form-urlencoded' } })
        .then(r => { localStorage.setItem('token', r.data.access_token); emit('logged'); })
        .catch(e => { alert((e.response && e.response.data.detail) || '登录失败'); });
    }
    return { username, password, doLogin };
  }
};

const Dashboard = {
  template: `
  <div>
    <div class="stat-grid">
      <div class="stat"><div class="num">{{ d.teachers }}</div><div class="label">教师总数</div></div>
      <div class="stat"><div class="num">{{ d.students }}</div><div class="label">学生总数</div></div>
      <div class="stat"><div class="num">{{ d.sessions_total }}</div><div class="label">本月课表节数</div></div>
      <div class="stat"><div class="num" style="color:#0f6e56">{{ d.published }}</div><div class="label">已发布</div></div>
      <div class="stat"><div class="num" style="color:#854f0b">{{ d.draft }}</div><div class="label">草稿待发布</div></div>
    </div>
    <div class="card">
      <h3>快速开始</h3>
      <p class="muted">1. 在「教师管理 / 学生管理 / 课程类型 / 节假日管理」维护基础数据　2. 进入「生成课表」按月份生成并发布　3. 发布后钉钉群机器人自动推送</p>
      <button class="btn" @click="goGen">去生成课表</button>
    </div>
  </div>`,
  setup() {
    const d = reactive({ teachers:0, students:0, sessions_total:0, published:0, draft:0 });
    function load() { http.get('/dashboard').then(r => Object.assign(d, r.data)); }
    function goGen() { location.hash = '/schedule-generate'; }
    onMounted(load);
    return { d, goGen };
  }
};

const Teachers = {
  template: `
  <div>
    <div class="toolbar">
      <button class="btn" @click="openAdd">+ 新增教师</button>
      <button class="btn btn-ghost" @click="dl('teachers/template','教师名单导入模板.xlsx')" title="下载标准格式的 Excel 模板（含填写说明）">下载导入模板</button>
      <button class="btn btn-ghost" @click="pickFile" title="按模板 Excel 批量导入/更新教师">导入 Excel</button>
      <input ref="fileEl" type="file" accept=".xlsx" style="display:none" @change="onFile"/>
      <button class="btn btn-ghost" @click="dl('teachers/export','教师名单.xlsx')" title="导出当前全部教师为 Excel">导出 Excel</button>
      <button v-if="hasSel" class="btn btn-ghost" @click="batchToggle(true)">启用选中（{{ sel.length }}）</button>
      <button v-if="hasSel" class="btn btn-ghost" style="color:#b54708;border-color:#b54708" @click="batchToggle(false)">停用选中（{{ sel.length }}）</button>
      <button v-if="hasSel" class="btn btn-ghost" style="color:#c0392b;border-color:#c0392b" @click="delSel">删除选中（{{ sel.length }}）</button>
      <span class="muted" style="font-size:12px">提示：新增/导入教师后，可用工号登录（初始密码 123456）；停用的教师不参与排课、不出现在选择名单，历史课表不受影响</span>
    </div>
    <div class="muted" v-if="msg" :style="{color: msgOk?'#1a7f37':'#c0392b', margin:'4px 2px 10px'}">{{ msg }}</div>
    <div class="selbar" v-if="hasSel">已选 <b>{{ sel.length }}</b> 名教师 <a @click="clearSel" style="margin-left:auto">清除选择</a></div>
    <table>
      <thead><tr>
        <th class="chk" v-if="isAdmin"><input type="checkbox" name="tea-sel-all" :checked="allSel" @change="toggleAll($event)" title="全选 / 取消全选"/></th>
        <th>工号</th><th>姓名</th><th>别名</th><th>可讲课</th><th>可主阅</th><th>可评审</th><th>可指导</th><th>请假日期</th><th>手机号</th><th>状态</th><th>操作</th></tr></thead>
      <tbody>
        <tr v-for="t in list" :key="t.id" :class="{picked: isSel(t.id)}" :style="t.enabled===false?'opacity:.55':''">
          <td class="chk" v-if="isAdmin"><input type="checkbox" :name="'tea-sel-'+t.id" :value="t.id" v-model="sel"/></td>
          <td>{{ t.emp_id }}</td><td>{{ t.name }}</td><td>{{ t.aliases||'-' }}</td>
          <td>{{ t.can_teach?'是':'否' }}</td><td>{{ t.can_main_read?'是':'否' }}</td><td>{{ t.can_review?'是':'否' }}</td><td>{{ t.can_mentor?'是':'否' }}</td>
          <td>{{ t.leave_dates||'-' }}</td><td>{{ t.phone||'-' }}</td>
          <td><span class="tag" :style="t.enabled===false?'background:#f2f4f7;color:#667085':'background:#ecfdf3;color:#1a7f37'">{{ t.enabled===false?'停用':'启用' }}</span></td>
          <td><a @click="openEdit(t)">编辑</a> <a @click="toggleOne(t)">{{ t.enabled===false?'启用':'停用' }}</a> <a v-if="isAdmin" @click="del(t)">删除</a></td>
        </tr>
        <tr v-if="!list.length"><td :colspan="isAdmin?12:11" class="muted">还没有教师，可「新增教师」或导入 Excel 名单。</td></tr>
      </tbody>
    </table>
    <div v-if="show" class="dialog-mask" @click.self="show=false">
      <div class="dialog">
        <h3>{{ editing?'编辑教师':'新增教师' }}</h3>
        <div class="field"><label>工号</label><input class="input" v-model="form.emp_id"/></div>
        <div class="field"><label>姓名</label><input class="input" v-model="form.name"/></div>
        <div class="field"><label>别名(逗号分隔, 用于重名区分, 如 王晓1)</label><input class="input" v-model="form.aliases"/></div>
        <div class="field"><label class="switch">
          <span><input type="checkbox" v-model="form.enabled"/> 启用（停用后不参与排课、不出现在选择名单）</span>
          <span><input type="checkbox" v-model="form.can_teach"/> 可讲课</span>
          <span><input type="checkbox" v-model="form.can_main_read"/> 可主阅</span>
          <span><input type="checkbox" v-model="form.can_review"/> 可评审</span>
          <span><input type="checkbox" v-model="form.can_mentor"/> 可指导</span>
        </label></div>
        <div class="field"><label>请假日期(逗号分隔, 如 2026-11-10)</label><input class="input" v-model="form.leave_dates"/></div>
        <div class="field"><label>手机号(钉钉绑定号, 用于自动待办提醒, 可空)</label><input class="input" v-model="form.phone" maxlength="11"/></div>
        <button class="btn" @click="save">保存</button>
        <button class="btn btn-ghost" @click="show=false">取消</button>
      </div>
    </div>
  </div>`,
  setup() {
    const list = ref([]);
    const show = ref(false);
    const editing = ref(false);
    const sel = ref([]);
    const hasSel = computed(() => sel.value.length > 0);
    const allSel = computed(() => list.value.length > 0 && sel.value.length === list.value.length);
    const form = reactive({ id:null, emp_id:'', name:'', aliases:'', can_teach:true, can_main_read:true, can_review:true, can_mentor:true, leave_dates:'', phone:'', enabled:true });
    function load() {
      http.get('/teachers').then(r => {
        list.value = r.data;
        const ids = {}; r.data.forEach(t => ids[t.id] = 1);
        sel.value = sel.value.filter(id => ids[id]);  // 删除后清掉已不存在的选中项
      });
    }
    function isSel(id) { return sel.value.includes(id); }
    function clearSel() { sel.value = []; }
    function toggleAll(e) { sel.value = e.target.checked ? list.value.map(t => t.id) : []; }
    function delSel() {
      const n = sel.value.length;
      const names = list.value.filter(t => sel.value.includes(t.id)).map(t => t.emp_id + ' ' + t.name);
      const preview = names.slice(0, 6).join('、') + (names.length > 6 ? ' 等' : '');
      if (!confirm('确认删除以下 ' + n + ' 名教师？\n\n' + preview + '\n\n对应的登录账号会一并删除，且不可恢复。')) return;
      http.post('/teachers/batch-delete', { ids: sel.value }).then(r => {
        msgOk.value = true; msg.value = '已删除 ' + r.data.deleted + ' 名教师（登录账号同步删除）';
        sel.value = []; load();
      }).catch(e => { msgOk.value = false; msg.value = '批量删除失败：' + ((e.response && e.response.data.detail) || e.message); });
    }
    function openAdd() { editing.value=false; Object.assign(form,{id:null,emp_id:'',name:'',aliases:'',can_teach:true,can_main_read:true,can_review:true,can_mentor:true,leave_dates:'',phone:'',enabled:true}); show.value=true; }
    function openEdit(t) { editing.value=true; Object.assign(form, JSON.parse(JSON.stringify(t))); show.value=true; }
    function save() {
      if (form.phone && !/^1\d{10}$/.test(form.phone)) { alert('手机号应为 11 位数字（钉钉绑定号）'); return; }
      const data = JSON.parse(JSON.stringify(form));
      const req = editing.value ? http.put('/teachers/'+form.id, data) : http.post('/teachers', data);
      req.then(() => { show.value=false; load(); }).catch(e=>alert((e.response&&e.response.data.detail)||'保存失败'));
    }
    function del(t) { if(!confirm('确认删除 '+t.name+'?')) return; http.delete('/teachers/'+t.id).then(load); }
    function toggleOne(t) {
      const to = t.enabled === false;
      const what = to ? '启用' : '停用';
      if (!to && !confirm('确认停用 ' + t.name + '？\n\n停用后：不参与自动排课、不出现在人员选择名单（负荷表/换人列表也不再显示）。\n历史课表与登录账号不受影响，可随时再启用。')) return;
      http.post('/teachers/batch-toggle', { ids: [t.id], enabled: to }).then(() => {
        msgOk.value = true; msg.value = '已' + what + ' ' + t.name; load();
      }).catch(e => { msgOk.value = false; msg.value = what + '失败：' + ((e.response && e.response.data.detail) || e.message); });
    }
    function batchToggle(enabled) {
      const to = enabled;
      const what = to ? '启用' : '停用';
      const names = list.value.filter(t => sel.value.includes(t.id)).map(t => t.name);
      if (!to && !confirm('确认停用以下 ' + sel.value.length + ' 名教师？\n\n' + names.slice(0, 8).join('、') + (names.length > 8 ? ' 等' : '') + '\n\n停用后不参与自动排课、不出现在人员选择名单；历史课表不受影响，可随时再启用。')) return;
      http.post('/teachers/batch-toggle', { ids: sel.value, enabled: to }).then(r => {
        msgOk.value = true; msg.value = '已' + what + ' ' + r.data.count + ' 名教师';
        sel.value = []; load();
      }).catch(e => { msgOk.value = false; msg.value = what + '失败：' + ((e.response && e.response.data.detail) || e.message); });
    }
    const fileEl = ref(null);
    const msg = ref(''); const msgOk = ref(true);
    function dl(url, filename) {
      http.get('/' + url + (url.indexOf('?') === -1 ? '?_t=' : '&_t=') + Date.now(), { responseType: 'blob' }).then(r => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(r.data); a.download = filename; a.click();
        URL.revokeObjectURL(a.href);
      }).catch(e => { msgOk.value = false; msg.value = '下载失败：' + ((e.response&&e.response.data&&e.response.data.detail)||e.message); });
    }
    function pickFile() { fileEl.value.value = ''; fileEl.value.click(); }
    function onFile(e) {
      const f = e.target.files[0]; if (!f) return;
      const fd = new FormData(); fd.append('file', f);
      http.post('/teachers/import', fd).then(r => {
        const d = r.data; msgOk.value = d.errors.length === 0;
        msg.value = '导入完成：新增 ' + d.created + ' 人，更新 ' + d.updated + ' 人'
          + (d.errors.length ? '；' + d.errors.length + ' 行失败：' + d.errors.map(x => '第' + x.row + '行 ' + x.msg).join('；') : '');
        load();
      }).catch(er => { msgOk.value = false; msg.value = '导入失败：' + ((er.response&&er.response.data&&er.response.data.detail)||er.message); });
      e.target.value = '';
    }
    onMounted(load);
    return { list, show, editing, form, openAdd, openEdit, save, del, toggleOne, batchToggle, fileEl, msg, msgOk, dl, pickFile, onFile,
             sel, hasSel, allSel, isSel, clearSel, toggleAll, delSel, isAdmin: useIsAdmin() };
  }
};

const Students = {

      <div class="field"><label>年级</label>
        <select class="input" v-model="form.grade"><option>一年级</option><option>二年级</option><option>三年级</option></select></div>
      <div class="field"><label>手机号（技能考核发布时用钉钉通知本人，可不填）</label>
        <input class="input" v-model="form.phone" placeholder="11 位手机号"/></div>
      <button class="btn" @click="save">保存</button> <button class="btn btn-ghost" @click="show=false">取消</button>
    </div></div>
  </div>`,
  setup(){ const list=ref([]); const show=ref(false); const editing=ref(false);
    const sel=ref([]);
    const hasSel=computed(()=>sel.value.length>0);
    const allSel=computed(()=>list.value.length>0 && sel.value.length===list.value.length);
    const form=reactive({id:null,stu_id:'',name:'',grade:'一年级',phone:''});
    function load(){
      http.get('/students').then(r=>{
        list.value=r.data;
        const ids={}; r.data.forEach(t=>ids[t.id]=1);
        sel.value=sel.value.filter(id=>ids[id]);
      });
    }
    function isSel(id){return sel.value.includes(id);}
    function clearSel(){sel.value=[];}
    function toggleAll(e){sel.value=e.target.checked?list.value.map(t=>t.id):[];}
    function delSel(){
      const n=sel.value.length;
      const names=list.value.filter(t=>sel.value.includes(t.id)).map(t=>t.stu_id+' '+t.name);
      const preview=names.slice(0,6).join('、')+(names.length>6?' 等':'');
      if(!confirm('确认删除以下 '+n+' 名学生？\n\n'+preview+'\n\n对应的登录账号会一并删除，且不可恢复。')) return;
      http.post('/students/batch-delete',{ids:sel.value}).then(r=>{
        msgOk.value=true; msg.value='已删除 '+r.data.deleted+' 名学生（登录账号同步删除）';
        sel.value=[]; load();
      }).catch(e=>{msgOk.value=false; msg.value='批量删除失败：'+((e.response&&e.response.data.detail)||e.message);});
    }
    function openAdd(){editing.value=false;Object.assign(form,{id:null,stu_id:'',name:'',grade:'一年级',phone:''});show.value=true;}
    function openEdit(t){editing.value=true;Object.assign(form,JSON.parse(JSON.stringify(t)));show.value=true;}
    function save(){const data=JSON.parse(JSON.stringify(form));const req=editing.value?http.put('/students/'+form.id,data):http.post('/students',data);req.then(()=>{show.value=false;load();}).catch(e=>alert((e.response&&e.response.data.detail)||'失败'));}
    function del(t){if(!confirm('删除 '+t.name+'?'))return;http.delete('/students/'+t.id).then(load);}
    const fileEl=ref(null); const msg=ref(''); const msgOk=ref(true);
    function dl(url, filename) {
      http.get('/' + url + (url.indexOf('?') === -1 ? '?_t=' : '&_t=') + Date.now(), { responseType: 'blob' }).then(r => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(r.data); a.download = filename; a.click();
        URL.revokeObjectURL(a.href);
      }).catch(e => { msgOk.value = false; msg.value = '下载失败：' + ((e.response&&e.response.data&&e.response.data.detail)||e.message); });
    }
    function pickFile(){ fileEl.value.value=''; fileEl.value.click(); }
    function onFile(e){
      const f=e.target.files[0]; if(!f) return;
      const fd=new FormData(); fd.append('file', f);
      http.post('/students/import', fd).then(r=>{
        const d=r.data; msgOk.value = d.errors.length===0;
        msg.value='导入完成：新增 '+d.created+' 人，更新 '+d.updated+' 人'
          +(d.errors.length ? '；'+d.errors.length+' 行失败：'+d.errors.map(x=>'第'+x.row+'行 '+x.msg).join('；') : '');
        load();
      }).catch(er=>{ msgOk.value=false; msg.value='导入失败：'+((er.response&&er.response.data&&er.response.data.detail)||er.message); });
      e.target.value='';
    }
    onMounted(load); return {list,show,editing,form,openAdd,openEdit,save,del,fileEl,msg,msgOk,dl,pickFile,onFile,
                             sel,hasSel,allSel,isSel,clearSel,toggleAll,delSel,isAdmin:useIsAdmin()}; }
};

          <div class="seq-chips">
            <span class="seq-chip" :class="{'seq-first': idx===0}" v-for="(name, idx) in seqItems(i-1)" :key="i+'-'+idx+'-'+name">
              {{ idx===0 ? '① ' : '' }}{{ name }}
              <button type="button" class="seq-btn" title="前移（本次讲课日先上）" @click="seqMove(i-1, idx, -1)" :disabled="idx===0">◀</button>
              <button type="button" class="seq-btn" title="后移" @click="seqMove(i-1, idx, 1)" :disabled="idx===seqItems(i-1).length-1">▶</button>
              <button type="button" class="seq-btn seq-x" title="从本节序列移除" @click="seqDel(i-1, idx)">×</button>
            </span>
            <span class="muted" style="font-size:12px" v-if="!seqItems(i-1).length">（空，请先添加课型）</span>
            <span class="seq-add">
              <select class="input seq-sel" v-model="seqAddPick[i-1]">
                <option value="">添加课型…</option>
                <option v-for="ct in ctOptions(i-1)" :key="ct" :value="ct">{{ ct }}</option>
              </select>
              <button type="button" class="btn seq-btn-add" title="添加到本节序列" @click="seqAdd(i-1)">＋</button>
            </span>
          </div>
          <input class="input" style="margin-top:6px" v-model="seqText[i-1]" placeholder="如：教学阅片,病例讨论（也可直接输入）"/>
        </div>
      </div>
      <div class="muted">课型按讲课日次序循环取用：第 1 次讲课日取序列第 1 个、第 2 次取第 2 个，用完回到第 1 个（标签上 ① 为下次讲课日的课型）。
        要交换「教学阅片」与「病例讨论」的先后，点标签上的 ◀ ▶ 调整即可；改完保存并重新生成课表才会生效。</div>
    </div>

    <div class="card">
      <h3>三、角色规则</h3>
      <div class="rules-grid">
        <div class="field"><label class="switch"><span><input type="checkbox" v-model="f.small_lecture_reader_is_teacher"/> 小讲课：主阅 = 讲课老师本人</span></label></div>
        <div class="field"><label>主阅来源</label>
          <select class="input" v-model="f.reader_source">
            <option value="student">学生（教学阅片/病例讨论由学生主阅）</option>
            <option value="teacher">教师（从教师名册中选）</option>
          </select>
        </div>
        <div class="field"><label class="switch"><span><input type="checkbox" v-model="f.distinct_roles"/> 同一节课：老师 ≠ 评审</span></label></div>
        <div class="field"><label class="switch"><span><input type="checkbox" v-model="f.reviewer_avoid_teacher_in_month"/> 评审避开本月已讲过课的人</span></label></div>
      </div>
    </div>

    <div class="card">
      <h3>四、轮转规则</h3>
      <div class="rules-grid">
        <div class="field"><label>老师每月上限（0 = 不限）</label><input class="input" type="number" min="0" max="20" v-model.number="f.monthly_limit.teacher"/></div>
        <div class="field"><label>评审每月上限（0 = 不限）</label><input class="input" type="number" min="0" max="20" v-model.number="f.monthly_limit.review"/></div>
        <div class="field"><label>主阅每月上限（0 = 不限）</label><input class="input" type="number" min="0" max="20" v-model.number="f.monthly_limit.student"/></div>
      </div>
      <div class="rules-grid">
        <div class="field"><label class="switch"><span><input type="checkbox" v-model="f.coverage_bias.teacher"/> 老师「三种课型全覆盖」偏置</span></label></div>
        <div class="field"><label class="switch"><span><input type="checkbox" v-model="f.coverage_bias.review"/> 评审「三种课型全覆盖」偏置</span></label></div>
        <div class="field"><label class="switch"><span><input type="checkbox" v-model="f.respect_leave"/> 生成时跳过教师请假日期</span></label></div>
      </div>
      <div class="muted">每月上限 = 0 表示不限次数（同月可多次）；设为 1 即「每人每月至多一次」。覆盖偏置会在轮转基础上优先挑还没上过该课型的人。</div>
    </div>

    <div class="card">
      <h3>五、节假日与时间</h3>
      <div class="rules-grid">
        <div class="field"><label>节假日策略</label>
          <select class="input" v-model="f.holiday_policy">
            <option value="same_weekday">顺延到下一个讲课日（按所选星期几）</option>
            <option value="next_workday">顺延到下一个工作日</option>
            <option value="none">不补（当月少几节）</option>
          </select>
        </div>
        <div class="field"><label>夏令月份（逗号分隔）</label><input class="input" v-model="summerText" placeholder="5,6,7,8,9"/></div>
        <div class="field"><label>小讲课时间</label><input class="input" v-model="f.time_rules['小讲课']" placeholder="8:00"/></div>
        <div class="field"><label>教学阅片（夏令 / 冬令）</label>
          <div class="pair"><input class="input" v-model="f.time_rules['教学阅片'].summer" placeholder="18:00"/>
            <input class="input" v-model="f.time_rules['教学阅片'].winter" placeholder="17:30"/></div>
        </div>
        <div class="field"><label>病例讨论（夏令 / 冬令）</label>
          <div class="pair"><input class="input" v-model="f.time_rules['病例讨论'].summer" placeholder="18:00"/>
            <input class="input" v-model="f.time_rules['病例讨论'].winter" placeholder="17:30"/></div>
        </div>
        <div class="field"><label>入科教育时间</label><input class="input" v-model="f.time_rules['入科教育']" placeholder="8:00"/></div>
        <div class="muted" style="font-size:12px">「研究生汇报」不用填时间：自动接在第二节结束之后（夏令 18:00+90 分钟＝19:30，冬令 17:30+90 分钟＝19:00）。</div>
      </div>
      <div class="muted">时间格式 H:MM，如 8:00、17:30。夏令月份内取「夏令」时间，其余取「冬令」。</div>
    </div>

    <div class="card">
      <h3>六、导出与反馈</h3>
      <div class="rules-grid">
        <div class="field"><label class="switch"><span><input type="checkbox" v-model="f.orientation.enabled"/> 导出首行加「入科教育」</span></label></div>
        <div class="field"><label>入科教育名称</label><input class="input" v-model="f.orientation.name"/></div>
        <div class="field"><label>默认题目</label><input class="input" v-model="f.default_topic"/></div>
        <div class="field"><label>出科考核反馈（末节课后 N 分钟）</label><input class="input" type="number" min="0" max="600" v-model.number="f.feedback_offsets['出科考核反馈']"/></div>
        <div class="field"><label>月考反馈（末节课后 N 分钟）</label><input class="input" type="number" min="0" max="600" v-model.number="f.feedback_offsets['月考反馈']"/></div>
      </div>
    </div>
  </div>`,
  setup(){
    const weekdays = ['周一','周二','周三','周四','周五','周六','周日'];
    const f = reactive({});
    const seqText = ref([]);
    const ctList = ref([]);          // 课型库（供序列编辑器「添加」下拉）
    const seqAddPick = reactive({}); // 每节序列的添加下拉选中值
    const summerText = ref('5,6,7,8,9');
    const saving = ref(false);
    const msg = ref(null);

    // 首次渲染前先铺满默认结构，避免 f.monthly_limit.teacher 等嵌套取值报 undefined
    fill({});

    function splitSeq(t){ return String(t||'').split(/[,，、;；\s]+/).map(s=>s.trim()).filter(Boolean); }
    // ---- 课型序列标签编辑：◀ ▶ 换序 / × 删除 / ＋ 添加，操作写回 seqText 文本 ----
    function seqItems(i){ return splitSeq(seqText.value[i]); }
    function writeSeq(i, arr){ seqText.value[i] = arr.join(','); }
    function seqMove(i, idx, dir){
      const arr = seqItems(i);
      const j = idx + dir;
      if (j < 0 || j >= arr.length) return;
      [arr[idx], arr[j]] = [arr[j], arr[idx]];
      writeSeq(i, arr);
    }
    function seqDel(i, idx){
      const arr = seqItems(i);
      arr.splice(idx, 1);
      writeSeq(i, arr);
    }
    function seqAdd(i){
      const name = seqAddPick[i];
      if (!name) return;
      const arr = seqItems(i);
      if (!arr.includes(name)) arr.push(name);
      writeSeq(i, arr);
      seqAddPick[i] = '';
    }
    function ctOptions(i){
      const used = seqItems(i);
      return ctList.value.filter(n => !used.includes(n));
    }
    function fill(r){
      Object.keys(f).forEach(k => delete f[k]);
      Object.assign(f, JSON.parse(JSON.stringify(r)));
      // 兜底：确保结构完整
      f.monthly_limit = Object.assign({teacher:1, review:1, student:1}, f.monthly_limit||{});
      f.coverage_bias = Object.assign({teacher:true, review:true, student:false}, f.coverage_bias||{});
      f.time_rules = Object.assign({'小讲课':'8:00','入科教育':'8:00'}, f.time_rules||{});
      ['教学阅片','病例讨论'].forEach(n => {
        const v = f.time_rules[n];
        f.time_rules[n] = (v && typeof v === 'object') ? Object.assign({summer:'18:00', winter:'17:30'}, v)
                                                      : {summer: v||'18:00', winter: v||'17:30'};
      });
      f.orientation = Object.assign({enabled:true, name:'入科教育', time:'8:00'}, f.orientation||{});
      f.feedback_offsets = Object.assign({'出科考核反馈':60,'月考反馈':90}, f.feedback_offsets||{});
      // 讲课日多选：兼容旧单选 weekday
      const wds = Array.isArray(f.weekdays) ? f.weekdays.map(Number) : [];
      f.weekdays = (wds.length ? wds : (f.weekday !== undefined ? [Number(f.weekday)] : [1]))
        .filter(w => Number.isInteger(w) && w >= 0 && w <= 6);
      seqText.value = (f.slot_types||[]).map(s => (Array.isArray(s)? s.join(',') : String(s||'')));
      summerText.value = (f.summer_months||[]).join(',');
      syncSeqLen();
    }
    function syncSeqLen(){
      const n = Number(f.slots_per_day) || 0;
      const arr = seqText.value.slice(0, Math.max(n,0));
      while (arr.length < n) arr.push(arr.length === 0 ? '小讲课' : (arr.length === 2 ? '研究生汇报' : ''));
      seqText.value = arr;
    }
    function load(){
      http.get('/rules').then(r => { fill((r.data&&r.data.rules)||{}); msg.value = null; })
        .catch(e => { msg.value = {type:'err', text:'加载失败：'+((e.response&&e.response.data&&e.response.data.detail)||e.message)}; });
      http.get('/classtypes').then(r => {           // 课型库：序列编辑器的「添加」下拉
        const d = r.data || [];
        ctList.value = d.map(x => (typeof x === 'string' ? x : (x.name || ''))).filter(Boolean);
      }).catch(() => {});
    }
    function payload(){
      return {
        weekdays: [...new Set((f.weekdays||[]).map(Number).filter(w=>Number.isInteger(w)&&w>=0&&w<=6))].sort((a,b)=>a-b),
        days_per_month: Number(f.days_per_month),
        slots_per_day: Number(f.slots_per_day),
        slot_types: seqText.value.slice(0, Number(f.slots_per_day)||0).map(splitSeq),
        small_lecture_reader_is_teacher: !!f.small_lecture_reader_is_teacher,
        reader_source: f.reader_source,
        distinct_roles: !!f.distinct_roles,
        reviewer_avoid_teacher_in_month: !!f.reviewer_avoid_teacher_in_month,
        monthly_limit: { teacher: Number(f.monthly_limit.teacher), review: Number(f.monthly_limit.review), student: Number(f.monthly_limit.student) },
        coverage_bias: { teacher: !!f.coverage_bias.teacher, review: !!f.coverage_bias.review, student: !!f.coverage_bias.student },
        respect_leave: !!f.respect_leave,
        holiday_policy: f.holiday_policy,
        summer_months: String(summerText.value||'').split(/[,，\s]+/).map(x=>parseInt(x,10)).filter(x=>x>=1&&x<=12),
        time_rules: {
          '小讲课': f.time_rules['小讲课'], '入科教育': f.time_rules['入科教育'],
          '教学阅片': { summer: f.time_rules['教学阅片'].summer, winter: f.time_rules['教学阅片'].winter },
          '病例讨论': { summer: f.time_rules['病例讨论'].summer, winter: f.time_rules['病例讨论'].winter }
        },
        orientation: { enabled: !!f.orientation.enabled, name: f.orientation.name, time: f.time_rules['入科教育'] },
        feedback_offsets: { '出科考核反馈': Number(f.feedback_offsets['出科考核反馈']), '月考反馈': Number(f.feedback_offsets['月考反馈']) },
        default_topic: f.default_topic
      };
    }
    function save(){
      saving.value = true; msg.value = {type:'info', text:'正在校验并保存…'};
      http.put('/rules', { rules: payload() }).then(r => {
        fill((r.data&&r.data.rules)||{});
        msg.value = {type:'ok', text:'规则已保存。回到「生成课表」重新生成才会生效。'};
      }).catch(e => {
        msg.value = {type:'err', text:'保存失败：'+((e.response&&e.response.data&&e.response.data.detail)||e.message)};
      }).finally(()=>{ saving.value = false; });
    }
    function reset(){
      saving.value = true;
      http.post('/rules/reset', {}).then(r => {
        fill((r.data&&r.data.rules)||{});
        msg.value = {type:'ok', text:'已恢复默认规则。'};
      }).catch(e => {
        msg.value = {type:'err', text:'恢复失败：'+((e.response&&e.response.data&&e.response.data.detail)||e.message)};
      }).finally(()=>{ saving.value = false; });
    }
    watch(() => f.slots_per_day, syncSeqLen);
    onMounted(load);
    return { weekdays, f, seqText, seqAddPick, summerText, saving, msg, save, reset,
             seqItems, seqMove, seqDel, seqAdd, ctOptions };
  }
};

  setup() {

    const fbRows = ref([]);
    const fbSaving = ref(false);
    const fbMsg = ref(null);

    const statList = ref([]);           // 老师负荷（后端已按「越久没排课越靠前」排好）
    const hlTeacher = ref(0);           // 表格里高亮的老师
    const cellEdit = ref(null);         // 正在就地编辑的课次 { id }
    function load() {
      http.get('/schedule?year='+year.value+'&month='+month.value).then(r => {
        sessions.value = r.data.sessions;
        teachersMap.value = r.data.teachers;
        studentsMap.value = r.data.students;
        studentOpts.value = Object.keys(r.data.students).map(id => ({ id: Number(id), name: r.data.students[id] }));

        gradMap.value = r.data.graduates || {};

        capT.value = cm;
        aliasT.value = am;
      }).catch(() => {});
      http.get('/students').then(r => {                     // 学号表：学生选择器支持按学号筛选
        const m = {};

      http.get('/graduates').then(r => {                    // 研究生名册：第三节汇报人
        gradOpts.value = (r.data || []).map(g => ({ id: g.id, name: g.name, sub: g.grad_id }));
      }).catch(() => {});
      loadFeedback();
      loadStats();
    }
    function loadFeedback() {
      http.get('/feedback?year='+year.value+'&month='+month.value).then(r => {
        const d = r.data || {};
        fbRows.value = (d.items||[]).map(it => ({
          kind: it.kind,
          sel: it.reporter_type && it.reporter_id ? (it.reporter_type[0] + it.reporter_id) : '',
          note: it.note || ''
        }));

    function saveFeedback() {
      fbSaving.value = true;

      const items = fbRows.value.map(f => {
        const sel = f.sel || '';
        return { kind: f.kind,
                 reporter_type: sel ? (sel[0]==='t' ? 'teacher' : 'student') : '',
                 reporter_id: sel ? Number(sel.slice(1)) : 0,
                 note: f.note || '' };

      http.put('/feedback', { year: year.value, month: month.value, items }).then(r => {
        const d = r.data || {};

        fbMsg.value = { type:'ok', text:'反馈已保存。' + parts.join(' ｜ ') };

      }).finally(() => { fbSaving.value = false; });
    }
    // ---- 表格视图：整月 × 节次，像考务表一样点格子改 ----
    function loadStats() {
      http.get('/schedule/teacher-load?year='+year.value+'&month='+month.value)
        .then(r => { statList.value = (r.data && r.data.teachers) || []; })
        .catch(() => { statList.value = []; });
    }
    // ---- 能力标签筛选（讲/阅/评/导）----
    const roleFilter = ref('');         // '' = 全部；teach/read/review/mentor
    const CAP_LABELS = { teach: '可讲课', read: '可主阅', review: '可评审', mentor: '可指导' };
    function capLabel(k) { return CAP_LABELS[k] || ''; }
    function capClick(k) { roleFilter.value = (roleFilter.value === k) ? '' : k; }
    const statView = computed(() => {
      if (!roleFilter.value) return statList.value;
      const key = { teach: 'can_teach', read: 'can_main_read', review: 'can_review', mentor: 'can_mentor' }[roleFilter.value];
      return statList.value.filter(t => t[key]);
    });
    const statMap = computed(() => {
      const m = {};
      statList.value.forEach(t => { m[t.id] = t; });
      return m;
    });
    // 下拉选项按负荷排序：久未排课的老师排在前面
    const teacherSorted = computed(() => {
      const idx = {};
      statList.value.forEach((t, i) => { idx[t.id] = i; });
      return teacherOpts.value.slice().sort((a, b) => {
        const x = idx[a.id] === undefined ? 9999 : idx[a.id];
        const y = idx[b.id] === undefined ? 9999 : idx[b.id];
        return x - y;
      });
    });
    function badgeOf(id) {
      const t = statMap.value[id];
      if (!t) return '';
      if (t.days_since >= 999) return t.m_count ? '（本月已排）' : '（从未排课）';
      if (t.days_since >= 30) return '（' + t.days_since + ' 天未排）';
      if (!t.m_count) return '（本月 0 节）';
      return '';
    }
    const slotCount = computed(() => {
      let n = 1;
      sessions.value.forEach(s => { if ((s.slot || 1) > n) n = s.slot; });
      return n;
    });
    const WD = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
    const gridRows = computed(() => {
      const m = {};
      sessions.value.forEach(s => {
        const key = s.date || ('d' + s.id);
        const row = m[key] || (m[key] = { date: s.date, week_index: s.week_index || 0, slots: {} });
        row.slots[s.slot] = s;
      });
      const arr = Object.keys(m).map(k => m[k]);
      arr.sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
      arr.forEach(r => {
        const d = new Date((r.date || '') + 'T00:00:00');
        r.wd = isNaN(d.getTime()) ? '' : WD[(d.getDay() + 6) % 7];
      });

    });
    function cellAt(row, n) { return row.slots[n] || null; }
    function isEditing(row, n) {
      const s = row.slots[n];
      return !!(cellEdit.value && s && cellEdit.value.id === s.id);

      popAnchorEl = (ev && ev.currentTarget) || null;      // 记住被点的格子，用于定位
      cellEdit.value = { id: s.id };

    // ---- 就地编辑浮层定位：固定定位挂 body，始终留在视口内（不被滚动容器裁切）----
    let popAnchorEl = null;
    function placePop() {
      const el = document.querySelector('.cell-float');
      if (!el || !popAnchorEl || !cellEdit.value) return;
      const r = popAnchorEl.getBoundingClientRect();
      const bw = el.offsetWidth || 238, bh = el.offsetHeight || 260;
      const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
      let left = Math.min(r.left, vw - bw - 8);
      left = Math.max(8, left);

      if (field === 'presenter_id') return gradsMap.value[id] || '';
      return teachersMap.value[id] || '-';
    }
    function mainName(s){ if (s && s.main_reader_name) return s.main_reader_name; return s.class_type_name==='小讲课' ? (teachersMap.value[s.main_reader_id]||'-') : (studentsMap.value[s.main_reader_id]||'-'); }
    function typeClass(n){return n==='研究生汇报'?'tag purple':(n==='小讲课'?'tag':(n==='病例讨论'?'tag amber':'tag green'));}
    function gradName(id){ return gradsMap.value[id] || ''; }
    function statusOf(g){return g.items[0].status==='published'?'已发布':'草稿';}
    function exportExcel(){ http.get('/schedule/export?year='+year.value+'&month='+month.value,{responseType:'blob'}).then(r=>{const url=window.URL.createObjectURL(new Blob([r.data]));const a=document.createElement('a');a.href=url;a.download='schedule_'+year.value+'_'+month.value+'.xlsx';a.click();window.URL.revokeObjectURL(url);}); }
    function exportYear(){ http.get('/schedule/export-year?year='+year.value,{responseType:'blob'}).then(r=>{const url=window.URL.createObjectURL(new Blob([r.data]));const a=document.createElement('a');a.href=url;a.download='schedule_year_'+year.value+'.xlsx';a.click();window.URL.revokeObjectURL(url);}).catch(e=>{alert('导出失败：'+((e.response&&e.response.data)||e.message));}); }
    function printPage(){ window.print(); }
    onMounted(()=>{month.value=new Date().getMonth()+1;load();});
    watch([year, month], load);
    return {year,month,sessions,grouped,load,name,mainName,roleName,typeClass,gradName,statusOf,exportExcel,exportYear,printPage,fbItems}; }
};

        http.post('/dingtalk/dm/notify',{year,month})
      ).then(r=>{
        const x=r.data||{};
        const who=(x.details||[]).map(i=>i.teacher+(i.proxy?'(代)':'')).join('、');
        let text=(x.note||'')+(who?'：'+who:'');
        if((x.failed||[]).length) text+='｜失败：'+x.failed.map(f=>f.teacher+'('+f.error+')').join('；');

      http.put('/dingtalk/config',JSON.parse(JSON.stringify(cfg))).then(saveExtras)
        .then(()=>note.value='已保存')
        .catch(e=>{msg.value={type:'err',text:'保存失败：'+((e.response&&e.response.data&&e.response.data.detail)||e.message)};});}

      msg.value={type:'info',text:'正在发送测试消息…'}; testing.value=true;
      // 先保存当前配置（含其他群），再测试，避免忘记保存
      http.put('/dingtalk/config',JSON.parse(JSON.stringify(cfg))).then(saveExtras).then(()=>
        http.post('/dingtalk/test',{})
      ).then(r=>{
        const d=r.data||{};
        msg.value = d.ok ? {type:'ok',text:'推送成功，请查看钉钉群。'}
                         : {type:'warn',text:'未成功：'+(d.note||'请检查 Webhook / 加签 / 启用开关')};
      }).catch(e=>{
        msg.value={type:'err',text:'测试失败：'+((e.response&&e.response.data&&e.response.data.detail)||e.message)};
      }).finally(()=>{testing.value=false;});
    }
    onMounted(load); return {cfg,note,testing,msg,save,test,showSecret,dmMonth,dmPushing,pushDm,extras,addExtra,delExtra}; }
};

const TopicFill = {
  template: `
  <div style="max-width:560px;margin:0 auto;padding:16px 14px 40px">
    <div class="card" style="padding:16px">
      <h3 style="margin:0 0 4px">课程内容填报</h3>

      <div v-for="x in items" :key="x.id" style="border-top:1px dashed var(--border);padding:10px 0">
        <div style="font-weight:600">{{ x.date }} 第{{ x.slot }}节 【{{ x.class_type_name }}】
          <span class="muted" style="font-weight:400">（{{ x.role }}）</span></div>
        <input v-if="x.editable" class="input" style="width:100%" maxlength="100"
               placeholder="讲课内容/题目，如：胸部CT阅片要点" v-model="x.topic"/>
        <div v-else class="muted">{{ x.topic || '（本节题目由讲课老师填写）' }}</div>
      </div>
      <div v-if="!items.length" class="muted">暂无与您相关的已发布课程。</div>
      <button class="btn btn-block" style="margin-top:12px" @click="save" :disabled="saving || !items.some(x=>x.editable)">
        {{ saving ? '保存中…' : '保存填报内容' }}</button>
      <div v-if="msg" :style="{color: msg.type==='ok'?'#1a7f37':'#c0392b', marginTop:'10px', textAlign:'center'}">{{ msg.text }}</div>

  setup(){
    const token = decodeURIComponent(location.hash.replace(/^#\/topic\/?/, '').split('?')[0]);
    const name = ref(''); const items = ref([]); const saving = ref(false); const msg = ref(null);
    function load(){
      http.get('/my-course/' + encodeURIComponent(token)).then(r => {

            <a @click="toggleActive(u)">{{u.is_active?'停用':'启用'}}</a>

          </td>
        </tr>

    </div>
    <div class="card" v-if="adding">
      <h3>新增账号</h3>
      <div class="field"><label>用户名</label><input name="acc-username" class="input" v-model="form.username" placeholder="工号 / 学号 / 自定义"/></div>
      <div class="field"><label>姓名</label><input name="acc-name" class="input" v-model="form.name" placeholder="姓名"/></div>
      <div class="field"><label>角色</label>
        <select name="acc-role" class="input" v-model="form.role">
          <option value="jiaowu">教务</option>
          <option value="teacher">教师</option>
          <option value="student">学生</option>
          <option value="admin">管理员</option>
        </select></div>
      <div class="field"><label>初始密码</label><input name="acc-pwd" class="input" v-model="form.password" placeholder="留空默认 123456"/></div>
      <div class="toolbar"><button class="btn" @click="save">创建</button><button class="btn btn-ghost" @click="adding=false">取消</button></div>
      <p class="muted" v-if="msg" :style="msgOk?'color:#0f6e56':'color:#c0392b'">{{msg}}</p>
    </div>
  </div>`,
  setup(){
    const list = ref([]), adding = ref(false), syncing = ref(false), syncMsg = ref('');
    const form = reactive({ username:'', name:'', role:'teacher', password:'' });
    const msg = ref(''), msgOk = ref(false);
    function load(){ http.get('/users').then(r=>list.value=r.data).catch(()=>{}); }
    function roleText(r){ return {admin:'管理员', jiaowu:'教务', teacher:'教师', student:'学生'}[r] || r; }
    function openAdd(){ form.username=''; form.name=''; form.role='teacher'; form.password=''; msg.value=''; adding.value=true; }
    function save(){
      http.post('/users', { username:form.username, name:form.name, role:form.role, password:form.password })
        .then(()=>{ msg.value='创建成功'; msgOk.value=true; adding.value=false; load(); })
        .catch(e=>{ msg.value=(e.response && e.response.data.detail) || '创建失败'; msgOk.value=false; });
    }
    function sync(){
      syncing.value = true; syncMsg.value = '';
      http.post('/users/sync').then(r=>{
        syncMsg.value = '本次新建 ' + r.data.created + ' 个账号' + (r.data.created ? '（初始密码 123456）' : '，所有人都有账号了');
        syncing.value = false; load();
      }).catch(()=>{ syncMsg.value = '同步失败'; syncing.value = false; });
    }
    function resetPwd(u){
      const pw = prompt('为「' + (u.name || u.username) + '」设置新密码（留空则重置为 123456）：', '');
      if (pw === null) return;
      http.put('/users/' + u.id, { password: pw.trim() || '123456' })
        .then(()=>alert('密码已重置')).catch(e=>alert((e.response && e.response.data.detail) || '操作失败'));
    }
    function toggleActive(u){
      http.put('/users/' + u.id, { is_active: !u.is_active })
        .then(load).catch(e=>{ alert((e.response && e.response.data.detail) || '操作失败'); load(); });
    }
    function del(u){
      if (!confirm('删除账号「' + (u.name || u.username) + '」？该账号将无法登录。')) return;
      http.delete('/users/' + u.id).then(load).catch(e=>alert((e.response && e.response.data.detail) || '删除失败'));
    }
    onMounted(load);
    return { list, adding, form, msg, msgOk, syncing, syncMsg, openAdd, save, sync, resetPwd, toggleActive, del, roleText };
  }
};

    <!-- 单元格编辑弹窗 -->
    <div v-if="editing" class="dialog-mask" @click.self="editing=null"><div class="dialog">

        <select class="input" id="edit-start" name="edit-start" v-model.number="editForm.start_min">

      <button class="btn btn-ghost" @click="deleteSeg" style="color:#c0392b;border-color:#c0392b">删除这一段</button>

  </div>`,
  setup() {
    const view = ref('list'), creating = ref(false), plans = ref([]), cur = ref(null);
    const teachers = ref([]), students = ref([]), pickedT = ref([]);

    const editing = ref(null), pubReport = ref(null);
    const editForm = reactive({ station_seq: 0, room: 0, start_min: 0 });
    const form = reactive({ name: '', exam_date: new Date().toISOString().slice(0,10), start_time: '12:30', tick_min: 10 });

    const pid = () => cur.value.plan.id;
    const stuRows = ref([]);
    const stColor = i => EXAM_PALETTE[i % EXAM_PALETTE.length];
    const stColorOf = seq => {
      const C = cur.value;
      if (!C) return EXAM_PALETTE[0];
      const i = (C.stations || []).findIndex(s => s.seq === seq);
      const s = i >= 0 ? C.stations[i] : null;
      return (s && s.color) || EXAM_PALETTE[(i < 0 ? 0 : i) % EXAM_PALETTE.length];
    };
    const stName = seq => { const s = ((cur.value && cur.value.stations) || []).find(x => x.seq === seq); return s ? s.name : ('第' + seq + '站'); };
    const stLoc = seq => { const s = ((cur.value && cur.value.stations) || []).find(x => x.seq === seq); return (s && s.location) || '—'; };
    const outCount = computed(() => stuRows.value.filter(r => r.is_out).length);
    const countOf = seq => stuRows.value.filter(r => r.is_out && r.stations.includes(seq)).length;
    const needOf = seq => { const s = ((cur.value && cur.value.stations) || []).find(x => x.seq === seq); return s ? countOf(seq) * s.duration_min : 0; };
    const totalStationVisits = computed(() => stuRows.value.filter(r => r.is_out).reduce((n, r) => n + r.stations.length, 0));

    function rebuildStuRows() {
      if (!cur.value) return;
      const saved = {};
      (cur.value.candidates || []).forEach(c => saved[c.student_id] = c);
      const seqs = (cur.value.stations || []).filter(s => s.enabled !== false).map(s => s.seq);
      stuRows.value = students.value.map(st => {
        const c = saved[st.id];
        return { student_id: st.id, name: st.name, grade: st.grade,
          is_out: c ? !!c.is_out : false,
          stations: c ? (c.stations ? String(c.stations).split(',').filter(Boolean).map(Number) : seqs.slice()) : [],
          cand_id: c ? c.id : null };
      });
    }

    function timeSlot(i) {
      const p = cur.value.plan;
      const parts = (p.start_time || '12:30').split(':');
      const base = (+parts[0] || 12) * 60 + (+parts[1] || 0);
      const s = base + i * p.tick_min, e = s + p.tick_min;
      const f = x => String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0');
      return f(s) + '-' + f(e);
    }
    const hhmm = m => timeSlot(Math.floor(m / (cur.value ? cur.value.plan.tick_min : 10))).split('-')[0];
    const endTime = computed(() => result.value ? timeSlot(Math.max(0, result.value.ticks - 1)).split('-')[1] : '');

    const peakNeed = computed(() => {
      if (!result.value) return 0;
      const p = cur.value.plan;
      const sts = (result.value.stations && result.value.stations.length) ? result.value.stations : cur.value.stations;
      let peak = 0;
      for (let t = 0; t < result.value.ticks; t++) {
        const a = t * p.tick_min, b = a + p.tick_min; let n = 0;
        sts.filter(s => s.enabled !== false).forEach(st => {
          if (result.value.slots.some(sg => sg.station_seq === st.seq && sg.start_min < b && sg.end_min > a)) n += (st.teachers || 1);

        peak = Math.max(peak, n);
      }
      return peak;
    });
    const teacherUsed = computed(() => {
      const c = result.value && result.value.capacity;
      if (c && c.teachers) return c.teachers;
      return ((cur.value && cur.value.stations) || []).filter(s => s.enabled !== false)
        .reduce((n, s) => n + (s.teachers || 1), 0);
    });
    const capText = computed(() => {
      const c = result.value && result.value.capacity;
      if (!c || !c.expanded || !c.expanded.length) return '';
      const dn = c.alt ? c.teachers - c.alt.teachers : 0;
      return '已扩容：' + c.expanded.map(e => stName(e.seq) + ' 扩至 ' + e.rooms + ' 考位').join('、')
        + (dn > 0 ? '（+' + dn + ' 名老师）' : '');
    });
    const capAlt = computed(() => {
      const c = result.value && result.value.capacity;
      if (!c || !c.alt || !c.alt.makespan) return '';
      const dt = c.alt.makespan - c.makespan, dn = c.alt.teachers - c.teachers;
      if (dt >= 0 || dn <= 0) return '';
      return '若多派 ' + dn + ' 名老师，可缩短到 ' + c.alt.makespan + ' 分钟';
    });

    const roomName = r => String.fromCharCode(65 + Math.max(0, r || 0));
    const roomLabel = seg => {
      const s = ((cur.value && cur.value.stations) || []).find(x => x.seq === seg.station_seq);
      return (s && s.elastic) ? '' : roomName(seg.room) + ' 考位';
    };
    const dutyTime = d => {
      const a = d.start_min, b = d.end_min;
      return hhmm(a) + ' – ' + hhmm(b);
    };

    const boardRows = computed(() => {
      const R = result.value, C = cur.value;
      if (!R || !C) return [];
      const tick = C.plan.tick_min || 10;
      const byStu = {};
      (R.slots || []).forEach(s => {
        const k = (s.student_id != null ? s.student_id : s.candidate_id);
        (byStu[k] = byStu[k] || []).push(s);
      });
      const out = [];
      stuRows.value.filter(r => r.is_out).forEach(r => {
        const segs = (byStu[r.student_id] || []).slice().sort((a, b) => a.start_min - b.start_min);
        const cellMap = {};
        segs.forEach(sg => {
          const a = Math.round(sg.start_min / tick), b = Math.round(sg.end_min / tick);
          for (let t = a; t < b; t++) cellMap[t] = sg;
        });
        const cells = [];
        let t = 0;
        while (t < R.ticks) {
          const sg = cellMap[t];
          if (!sg) { cells.push({ empty: true, span: 1, t0: t }); t++; continue; }
          const t0 = Math.round(sg.start_min / tick);
          const span = Math.max(1, Math.round(sg.end_min / tick) - t0);
          const st = C.stations.find(x => x.seq === sg.station_seq);
          const elastic = !!(st && st.elastic);
          const tag = elastic ? '' : roomName(sg.room);
          cells.push({ seg: sg, span: span, t0: t0,
            color: stColorOf(sg.station_seq), bad: conflictSet.value.has(sg),
            label: (st ? st.name : ('第' + sg.station_seq + '站')) + tag,
            tip: (st ? st.name : '') + ' ' + tag + '｜' + hhmm(sg.start_min) + '–' + hhmm(sg.end_min) });
          t += span;
        }
        out.push({ sid: r.student_id, name: r.name, grade: r.grade, cells: cells,
          done: segs.length ? segs.map(s => s.station_seq).join('·') : '-' });
      });
      return out;
    });

    // ---- 冲突检测：编辑时只标红不打断，保存时统一校验 ----
    const conflictList = computed(() => {
      const R = result.value, C = cur.value;
      if (!R || !C) return [];
      const tick = C.plan.tick_min || 10;
      const seen = new Map();               // seg -> reasons[]
      const add = (seg, reason) => {
        if (!seen.has(seg)) seen.set(seg, []);
        seen.get(seg).push(reason);
      };
      const byStu = {};
      (R.slots || []).forEach(s => {
        const k = sidOf(s);
        (byStu[k] = byStu[k] || []).push(s);
      });
      Object.values(byStu).forEach(lst => {
        lst.sort((a, b) => a.start_min - b.start_min);
        for (let i = 0; i < lst.length; i++)
          for (let j = i + 1; j < lst.length && lst[j].start_min < lst[i].end_min; j++) {
            add(lst[i], '与 ' + nameOf(lst[j]) + ' 本人时段重叠');
            add(lst[j], '与 ' + nameOf(lst[i]) + ' 本人时段重叠');
          }
      });
      (C.stations || []).filter(s => s.enabled !== false && !s.elastic).forEach(st => {
        const maxT = R.slots.reduce((m, x) => Math.max(m, x.end_min), 0);
        for (let t = 0; t < maxT; t += tick) {
          const cov = R.slots.filter(x => x.station_seq === st.seq && x.start_min <= t && x.end_min > t);
          if (cov.length > (st.rooms || 1))
            cov.forEach(x => add(x, st.name + ' ' + hhmm(t) + ' 时段考位不够（' + cov.length + '>' + (st.rooms || 1) + '）'));
        }
      });
      return [...seen.entries()].map(([seg, reasons]) => ({ seg: seg, reasons: reasons }));
    });
    const conflictSet = computed(() => new Set(conflictList.value.map(x => x.seg)));
    const conflictCount = computed(() => conflictList.value.length);

    function loadPlans() { http.get('/exam/plans').then(r => plans.value = r.data).catch(() => {}); }
    function applyResult(d) {
      cellEdit.value = null;
      dutyEdit.value = -1; dutyLock.value = false;
      const byCand = {};
      (cur.value.candidates || []).forEach(c => byCand[c.id] = c);
      const slots = (d.slots || []).map(x => Object.assign({}, x,
        { student_id: x.student_id != null ? x.student_id : (byCand[x.candidate_id] || {}).student_id }));
      result.value = Object.assign({}, d, { slots: slots, duties: d.duties || [] });
      dirty.value = false;
    }
    function openPlan(id) {
      busy.value = true;
      Promise.all([http.get('/exam/plans/' + id), http.get('/teachers'), http.get('/students'),
                   http.get('/exam/teacher-load?plan_id=' + id)]).then(rs => {
        cur.value = rs[0].data;
        if (cur.value.plan.expand_penalty == null) cur.value.plan.expand_penalty = 20;
        teachers.value = rs[1].data;
        students.value = rs[2].data;
        tload.value = (rs[3].data && rs[3].data.teachers) || [];
        const byId = {}; tload.value.forEach(x => byId[x.id] = x);
        teachers.value.forEach(t => {
          const h = byId[t.id]; if (!h) return;

        });
        tPickSeq.value = 0;
        pickedT.value = teachers.value.filter(t => !(t.leave_dates || '').includes(cur.value.plan.exam_date)).map(t => t.id);
        rebuildStuRows();
        const saved = cur.value.slots || [];
        if (saved.length) {
          const tick = cur.value.plan.tick_min || 10;
          const byCand = {};
          (cur.value.candidates || []).forEach(c => byCand[c.id] = c);
          const slots = saved.map(x => Object.assign({}, x, { student_id: (byCand[x.candidate_id] || {}).student_id }));
          const ticks = Math.max(1, ...slots.map(s => Math.ceil(s.end_min / tick)));
          const ms = Math.max(0, ...slots.map(s => s.end_min));
          const duties0 = (cur.value.duties || []).map(d => Object.assign({}, d, {
            teachers: typeof d.teachers === 'string' ? d.teachers.split(',').filter(Boolean) : (d.teachers || []),
            teacher_ids: typeof d.teacher_ids === 'string' ? d.teacher_ids.split(',').filter(Boolean).map(Number) : (d.teacher_ids || [])
          }));
          result.value = { slots: slots, duties: duties0, ticks: ticks, makespan: ms,
            batches: Math.max(0, ...slots.map(s => s.batch || 0)) + 1,

    function saveCands() {
      const payload = stuRows.value.map((r, i) => ({ student_id: r.student_id, name: r.name, group: r.grade,

    function nowOf(id) {

    function toggleT(t) {

    function allOut(v) { stuRows.value.forEach(r => { r.is_out = v; if (v && !r.stations.length) r.stations = cur.value.stations.filter(s => s.enabled !== false).map(s => s.seq); }); }

    }

    function goStep(n) {

      if (dirty.value && n !== 4 && !confirm('重新进入该步会重排草稿，第 ④ 步的手工微调将被覆盖，继续？')) return;

    }
    function onTickChange() { if (result.value) regen(); }

    // ---- 表格直接编辑 ----
    const editStation = computed(() => {
      const C = cur.value; if (!C) return null;

    });
    const editDur = computed(() => (editStation.value ? editStation.value.duration_min : 10));
    const startOptions = computed(() => {
      const C = cur.value, R = result.value;

      const arr = [];
      for (let t = 0; t <= maxTick * tick; t += tick) arr.push(t);
      return arr;
    });
    function openEdit(row, cell) {
      const seg = cell.seg;

    }

    }
    function applyEdit() {
      const e = editing.value; if (!e) return;
      const st = editStation.value; if (!st) return;
      const a = editForm.start_min, b = a + st.duration_min;
      const seg = e.seg;
      const k = (seg.student_id != null ? seg.student_id : seg.candidate_id);
      const sameStu = x => (x.student_id != null ? x.student_id : x.candidate_id) === k;
      const clashSelf = result.value.slots.some(x => x !== seg && sameStu(x) && x.start_min < b && a < x.end_min);
      if (clashSelf) { alert('该考生在这个时段已有安排，请换个时间。'); return; }
      const room = st.elastic ? 0 : editForm.room;
      const clashRoom = result.value.slots.some(x => x !== seg && x.station_seq === editForm.station_seq

      if (clashRoom) {

          && (x.room || 0) === room && x.start_min < b && a < x.end_min);
        alert('该考位在这个时段已被占用（' + nameOf(other) + '），请换考位或换时间。');

      }

      seg.room = room;

    }
    function nameOf(seg) {
      if (!seg) return '他人';
      const cid = seg.student_id != null ? seg.student_id : seg.candidate_id;
      const stu = students.value.find(s => s.id === cid);
      if (stu) return stu.name;
      const c = (cur.value.candidates || []).find(x => x.id === seg.candidate_id);
      return c ? c.name : '他人';
    }
    function deleteSeg() {
      const e = editing.value; if (!e) return;

    }

    // ---- Excel 式就地编辑：单击格子选考站、拖拽挪时间、方向键换格 ----
    const cellEdit = ref(null), dragSeg = ref(null), selRange = ref(null);
    const tickOf = () => (cur.value && cur.value.plan.tick_min) || 10;
    const sidOf = s => (s.student_id != null ? s.student_id : s.candidate_id);
    function segAt(sid, t) {
      if (!result.value) return null;
      const a = t * tickOf(), b = a + tickOf();
      return (result.value.slots || []).find(x => sidOf(x) === sid && x.start_min <= a && x.end_min >= b) || null;
    }
    const isSel = (row, c) => !!(cellEdit.value && cellEdit.value.sid === row.sid && cellEdit.value.t0 === c.t0);
    // 只有双击（或按 Enter）才展开就地编辑浮层：单击只负责选中，避免挡住 Shift 连选
    const isEditing = (row, c) => !!(cellEdit.value && cellEdit.value.pop) && isSel(row, c) && step.value === 4;
    const cellRowName = computed(() => {
      const e = cellEdit.value; if (!e) return '';
      const r = boardRows.value.find(x => x.sid === e.sid);
      return r ? r.name : '';
    });
    const cellStation = computed(() => {
      const e = cellEdit.value;
      if (!e || !e.seg) return null;

    });
    const cellStationElastic = computed(() => !!(cellStation.value && cellStation.value.elastic));
    const cellStationRooms = computed(() => (cellStation.value ? (cellStation.value.rooms || 1) : 1));
    const cellOptions = computed(() => {
      const C = cur.value;
      if (!C) return [];
      return (C.stations || []).filter(s => s.enabled !== false)
        .map(s => ({ seq: s.seq, name: s.name, dur: s.duration_min }));
    });

    function freeRoom(seq, a, b, skip) {
      const st = (cur.value.stations || []).find(s => s.seq === seq);
      if (!st) return null;
      if (st.elastic) return 0;

      }
      return null;
    }
    // 静默应用改动：冲突不弹窗，靠 conflictList 标红 + 保存时统一校验
    function moveSeg(seg, seq, room, a) {
      const st = (cur.value.stations || []).find(s => s.seq === seq);
      if (!st) return false;
      let rm = st.elastic ? 0 : room;
      if (!st.elastic) {
        const f = freeRoom(seq, a, a + st.duration_min, seg);

      seg.start_min = a; seg.end_min = a + st.duration_min;

    }
    function pickCell(row, c, ri, ev) {
      const R = boardRows.value, ticks = result.value ? result.value.ticks : 1;

      if (e.seg) { moveSeg(e.seg, v, e.seg.room || 0, e.seg.start_min); resetSelect(ev, e.seg.station_seq); return; }
      const a = e.t0 * tickOf(), k = e.sid;

        ? freeRoom(v, a, a + st.duration_min, null) : 0);   // 没空考位也允许插，标红提示

    // ---- 复制 / 剪切 / 粘贴（Ctrl+C / X / V，浮层里也有按钮） ----
    const clip = ref(null);        // 单格：{station_seq,dur}；区域：{range:true,rows,cols,items}

    function rangeItems() {

                       sid: row.sid, seg: c.seg });

      }

    }

    function copySel() {
      const r = rangeItems();
      if (r) { clip.value = r; return; }

    }
    function cutSel() {
      const r = rangeItems();

      if (!e || !e.seg) { clip.value = null; return; }
