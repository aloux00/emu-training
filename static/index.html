    }
    function pasteSel() {
      const e = cellEdit.value, c = clip.value;
      if (!e || !c) return;
      if (c.range) {
        const R = boardRows.value, tick = tickOf();
        const ri0 = R.findIndex(r => r.sid === e.sid);
        if (ri0 < 0) return;
        const t0 = e.t0;
        const sids = R.slice(ri0, ri0 + c.rows).map(r => r.sid);
        const a0 = t0 * tick, b0 = (t0 + c.cols) * tick;
        // Excel 语义：粘贴覆盖目标矩形，先把该矩形内原有安排清掉
        result.value.slots = result.value.slots.filter(x =>
          !(sids.indexOf(sidOf(x)) >= 0 && x.start_min < b0 && a0 < x.end_min));
        c.items.forEach(it => {
          const row = R[ri0 + it.dr];
          if (!row) return;
          const st = (cur.value.stations || []).find(s => s.seq === it.seq);
          if (!st) return;
          const a = (t0 + it.dt) * tick, b = a + it.dur;
          let rm = 0;
          if (!st.elastic) { const f = freeRoom(it.seq, a, b, null); rm = f != null ? f : 0; }
          const cand = (cur.value.candidates || []).find(x => x.student_id === row.sid);
          result.value.slots.push({ station_seq: it.seq, room: rm, start_min: a, end_min: b,
            candidate_id: cand ? cand.id : 0, student_id: row.sid, batch: 0 });
        });
        selRange.value = { r1: ri0, r2: Math.min(R.length - 1, ri0 + c.rows - 1),
          t1: t0, t2: t0 + c.cols - 1, anchorRi: ri0, anchorT: t0, anchorSpan: 1 };
        cellEdit.value = { sid: e.sid, t0, seg: segAt(e.sid, t0), up: false, rt: false };
        afterEdit();
        return;
      }
      const a = e.t0 * tickOf(), b = a + c.dur;
      const st = (cur.value.stations || []).find(s => s.seq === c.station_seq);
      if (!st) return;
      // Excel 语义：粘贴覆盖目标区域，先移走该生与此区间重叠的段
      result.value.slots = result.value.slots.filter(x => !(sidOf(x) === e.sid && x.start_min < b && a < x.end_min));
      e.seg = null;
      let rm = 0;
      if (!st.elastic) { const f = freeRoom(c.station_seq, a, b, null); rm = f != null ? f : 0; }
      const cand = (cur.value.candidates || []).find(x => x.student_id === e.sid);
      const seg = { station_seq: c.station_seq, room: rm, start_min: a, end_min: b,
        candidate_id: cand ? cand.id : 0, student_id: e.sid, batch: 0 };
      result.value.slots.push(seg);
      e.seg = seg;
      afterEdit();
    }

    function onBoardKey(ev) {
      const e = cellEdit.value;
      if (!e || step.value !== 4) return;
      const tick = tickOf(), rows = boardRows.value, maxT = Math.max(1, result.value ? result.value.ticks : 1);
      if (ev.ctrlKey || ev.metaKey) {
        const k = (ev.key || '').toLowerCase();
        if (k === 'c') { ev.preventDefault(); copySel(); }
        else if (k === 'x') { ev.preventDefault(); cutSel(); }
        else if (k === 'v') { ev.preventDefault(); pasteSel(); }
        return;
      }
      if (ev.key === 'Escape') {
        if (e.pop) cellEdit.value = Object.assign({}, e, { pop: false });   // 先收起浮层，保留选中
        else clearFocus();
        return;
      }
      if (ev.key === 'Enter') { ev.preventDefault(); cellEdit.value = Object.assign({}, e, { pop: true }); return; }
      if (ev.key === 'Delete' || ev.key === 'Backspace' || ev.key === '0') {
        ev.preventDefault();
        if (selRange.value) deleteRange(); else deleteCellSeg(true);
        return;
      }
      if (/^[1-9]$/.test(ev.key)) {
        const st = (cur.value.stations || []).filter(x => x.enabled !== false)[Number(ev.key) - 1];
        if (st) { ev.preventDefault(); onCellStation(st.seq); }
        return;
      }
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(ev.key) < 0) return;
      ev.preventDefault();
      const ri = rows.findIndex(r => r.sid === e.sid);
      let t = e.t0, r = ri;
      if (ev.key === 'ArrowLeft') t = Math.max(0, t - 1);
      if (ev.key === 'ArrowRight') t = Math.min(maxT - 1, t + 1);
      if (ev.key === 'ArrowUp') r = Math.max(0, r - 1);
      if (ev.key === 'ArrowDown') r = Math.min(rows.length - 1, r + 1);
      const row = rows[r]; if (!row) return;
      cellEdit.value = { sid: row.sid, t0: t, seg: segAt(row.sid, t), pop: e.pop,
        up: r >= rows.length - 2, rt: t >= maxT - 3 };
    }
    function recompute() {
      const R = result.value; if (!R) return;
      const tick = cur.value.plan.tick_min || 10;
      R.ticks = Math.max(1, ...R.slots.map(s => Math.ceil(s.end_min / tick)));
      R.makespan = Math.max(0, ...R.slots.map(s => s.end_min));
      R.capacity = Object.assign({}, R.capacity, { makespan: R.makespan });
    }
    function afterEdit() { recompute(); dirty.value = true; scheduleDutyRefresh(); }
    let dutyTimer = null;
    function scheduleDutyRefresh() { clearTimeout(dutyTimer); dutyTimer = setTimeout(refreshDuties, 300); }
    function refreshDuties() {
      if (!result.value || dutyLock.value) return;
      http.post('/exam/plans/' + pid() + '/duties', {
        slots: result.value.slots.map(s => ({ station_seq: s.station_seq, room: s.room || 0,
          start_min: s.start_min, end_min: s.end_min })),
        teacher_ids: pickedT.value
      }).then(r => { result.value.duties = (r.data && r.data.duties) || []; }).catch(() => {});
    }

    function persist() {
      const conflicts = conflictList.value;
      if (conflicts.length) {
        const lines = conflicts.slice(0, 10).map(x =>
          nameOf(x.seg) + ' · ' + stName(x.seg.station_seq) + ' ' + hhmm(x.seg.start_min) + '–' + hhmm(x.seg.end_min)
          + '：' + x.reasons.join('；'));
        const more = conflicts.length > 10 ? '\n…还有 ' + (conflicts.length - 10) + ' 处' : '';
        return Promise.reject(new Error('还有 ' + conflicts.length + ' 处冲突（表中标红），处理完再保存：\n' + lines.join('\n') + more));
      }
      return savePlan().then(() => saveStations(true)).then(() => saveCands())
        .then(() => {
          const byStu = {};
          (cur.value.candidates || []).forEach(c => byStu[c.student_id] = c.id);
          return http.post('/exam/plans/' + pid() + '/save', {
            slots: result.value.slots.map(s => ({ station_seq: s.station_seq, room: s.room || 0,
              start_min: s.start_min, end_min: s.end_min,
              candidate_id: byStu[s.student_id] || s.candidate_id || 0, batch: s.batch || 0 })),
            duties: (result.value.duties || []).map(d => ({ station_seq: d.station_seq, room: d.room == null ? -1 : d.room,
              start_min: d.start_min, end_min: d.end_min,
              teacher_id: d.teacher_id || ((d.teacher_ids && d.teacher_ids[0]) || 0),
              teacher_name: d.teacher_name || ((d.teachers && d.teachers[0]) || ''),
              teachers: d.teachers || [], teacher_ids: d.teacher_ids || [],
              batch: d.batch || 0 }))
          });
        });
    }
    function saveDraft() {
      if (!result.value) return;
      busy.value = true;
      return persist()
        .then(() => { dirty.value = false; message('草稿已保存'); })
        .catch(e => alert('保存失败：' + errText(e)))
        .finally(() => busy.value = false);
    }
    function publish() {
      if (!result.value) return;
      if (!confirm('发布后会给监考老师和考生推送钉钉消息，确定发布？')) return;
      busy.value = true;
      pubReport.value = null;
      persist()
        .then(() => http.post('/exam/plans/' + pid() + '/publish', { notify: true }))
        .then(r => {
          pubReport.value = r.data || {};
          dirty.value = false;
          cur.value.plan.status = 'published';
          loadPlans();
        })
        .catch(e => alert('发布失败：' + errText(e)))
        .finally(() => busy.value = false);
    }

    // 导出 xlsx：由后端生成（标题带年月、单元格保留考站底色、另附监考老师与监考时长）
    function exportXlsx() {
      const pid = cur.value.plan.id;
      const dl = () => http.get('/exam/plans/' + pid + '/export', { responseType: 'blob' })
        .then(r => {
          let name = (cur.value.plan.name || '技能考核') + '.xlsx';
          const hd = (r.headers && (r.headers['content-disposition'] || r.headers['Content-Disposition'])) || '';
          const m = /filename\*=UTF-8''([^;]+)/i.exec(hd);
          if (m) { try { name = decodeURIComponent(m[1]); } catch (e) { } }
          const a = document.createElement('a');
          a.href = URL.createObjectURL(r.data);
          a.download = name;
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        })
        .catch(e => alert('导出失败：' + errText(e)));
      // 导出的是库里保存的版本：有改动先保存，避免导出和页面不一致
      if (dirty.value) persist().then(dl).catch(e => alert(e.message || String(e)));
      else dl();
    }

    function exportCsv() {
      const R = result.value, p = cur.value.plan;
      if (!R) return;
      const seqName = {}; cur.value.stations.forEach(s => seqName[s.seq] = s.name);
      const rows = [['考生', '组别']];
      for (let i = 0; i < R.ticks; i++) rows[0].push(timeSlot(i));
      rows[0].push('已考站');
      const byStu = {};
      R.slots.forEach(s => { const k = (s.student_id != null ? s.student_id : s.candidate_id); (byStu[k] = byStu[k] || []).push(s); });
      stuRows.value.filter(r => r.is_out).forEach(r => {
        const segs = (byStu[r.student_id] || []).slice().sort((a, b) => a.start_min - b.start_min);
        const cell = {};
        segs.forEach(sg => {
          const st = cur.value.stations.find(x => x.seq === sg.station_seq);
          const tag = (seqName[sg.station_seq] || '') + ((st && st.elastic) ? '' : roomName(sg.room));
          for (let t = Math.round(sg.start_min / p.tick_min); t < Math.round(sg.end_min / p.tick_min); t++) cell[t] = tag;
        });
        const line = [r.name, r.grade];
        for (let i = 0; i < R.ticks; i++) line.push(cell[i] || '');
        line.push(segs.length ? segs.map(s => s.station_seq).join('·') : '');
        rows.push(line);
      });
      rows.push([]); rows.push(['考站', '时段', '监考老师', '地点']);
      (R.duties || []).forEach(d => {
        rows.push([stName(d.station_seq), dutyTime(d), (d.teachers || []).join('、'), stLoc(d.station_seq)]);
      });
      const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = (cur.value.plan.name || '考务安排') + '.csv'; a.click();
    }
    function message(msg) { alert(msg); }

    onMounted(loadPlans);
    return { view, creating, plans, cur, form, teachers, students, pickedT, tload, tPickSeq, tName, tBadge, tTip, stTids, toggleStTeacher, nowOf,
      dutyEdit, dutyLock, needOfSeq, dutyHas, dutyClash, toggleDutyTeacher, recomputeDuties,
      result, busy, dirty, step,
      stuRows, outCount, countOf, needOf, totalStationVisits, peakNeed, teacherUsed, endTime,
      capText, capAlt, boardRows, timeSlot, hhmm, dutyTime, stName, stLoc, stColor, stColorOf, roomName, roomLabel,
      loadPlans, openPlan, back, doCreate, delPlan, goStep, genDefault, regen, onAutoScale, onTickChange, isAdmin: useIsAdmin(),
      bump, setColor, onAlignChange, isLeave, toggleT, toggleSt, allOut, onOutChange, saveDraft, publish, exportCsv, exportXlsx, refreshDuties,
      cellEdit, dragSeg, selRange, isSel, inRange, clearFocus, deleteRange, isEditing, pickCell, openCellPop, onCellStation, onCellRoom, onCellStart, deleteCellSeg,
      cellRowName, cellStationElastic, cellStationRooms, cellOptions, dragStart, dropOn, onBoardKey,
      clip, copySel, cutSel, pasteSel, conflictCount, conflictList,
      editing, editForm, editStation, editDur, startOptions, openEdit, onPickStation, applyEdit, deleteSeg,
      pubReport, failures: computed(() => {
        const r = pubReport.value; if (!r) return [];
        const out = [];
        ['teachers', 'students'].forEach(k => {
          ((r[k] || {}).failed || []).forEach(x => out.push((k === 'teachers' ? '老师 ' : '考生 ') + x.name + ' 推送失败：' + x.error));

// ---- 可输入筛选的人员选择器（老师/主阅/评审/指导下拉框人数多时用）----
// 输入姓名/工号即时过滤；粘贴「张三」或「张三(63035)」精确命中自动选中；回车选第一个匹配。
const PersonPicker = {
  props: {
    options: { type: Array, default: function () { return []; } },
    modelValue: { type: [Number, String], default: 0 },
    allowEmpty: { type: Boolean, default: false },
    emptyLabel: { type: String, default: '（无）' },
    placeholder: { type: String, default: '姓名/工号/拼音首字母' }
  },
  emits: ['pick'],
  template: `
  <span class="pp">
    <input ref="inputEl" class="input pp-input" :value="editing ? kw : dispText"
      :placeholder="placeholder" @focus="onFocus" @blur="onBlur" @input="onInput"
      @keyup.enter="onEnter" @keydown.esc.prevent="onEsc"/>
    <span class="pp-caret">▾</span>
    <div class="pp-list" :class="{up: dropUp}" v-if="editing">
      <div class="pp-item pp-none-item" v-if="allowEmpty" @mousedown.prevent="choose(null)">{{ emptyLabel }}</div>
      <div class="pp-item" v-for="o in filtered" :key="o.id" @mousedown.prevent="choose(o)">
        <b>{{ o.name }}</b>
        <span class="pp-note" v-if="o.note">{{ o.note }}</span>
        <span class="pp-sub" v-if="o.sub">{{ o.sub }}</span>
      </div>
      <div class="pp-none" v-if="!filtered.length">无匹配：可输入姓名、工号或拼音首字母（如 wl）</div>
    </div>
  </span>`,
  setup(props, ctx) {
    const { ref, computed, nextTick } = Vue;
    const editing = ref(false);
    const kw = ref('');
    const dropUp = ref(false);           // 下拉向上弹（浮层贴视口底部时）
    const inputEl = ref(null);
    const current = computed(() => {
      const v = Number(props.modelValue || 0);
      return props.options.find(o => Number(o.id) === v) || null;
    });
    const dispText = computed(() => current.value ? current.value.name : '');
    function parseKw(s) {
      const k = String(s || '').trim();
      const m = k.match(/^(.*?)\(([^)]+)\)\s*$/);
      return m ? { name: m[1].trim().toLowerCase(), code: m[2].trim().toLowerCase(), raw: k.toLowerCase() }
               : { name: k.toLowerCase(), code: '', raw: k.toLowerCase() };
    }
    const filtered = computed(() => {
      const k = parseKw(kw.value);
      if (!k.raw) return props.options;
      return props.options.filter(o => {
        const nm = String(o.name || '').toLowerCase();
        const sub = String(o.sub || '').toLowerCase();
        const note = String(o.note || '').toLowerCase();
        const alias = String(o.alias || '').toLowerCase();  // 别名（如重名老师的「王晓1」）
        const pyi = String(o.pyi || '').toLowerCase();   // 拼音首字母，如 wl
        const pyq = String(o.pyq || '').toLowerCase();   // 全拼，如 wangli
        if (k.code) return sub === k.code || nm === k.name;
        return nm.indexOf(k.raw) !== -1 || sub.indexOf(k.raw) !== -1 || note.indexOf(k.raw) !== -1
          || (alias && (alias === k.raw || alias.indexOf(k.raw) !== -1))
          || (pyi && pyi.indexOf(k.raw) === 0) || (pyq && pyq.indexOf(k.raw) !== -1);
      });
    });
    function choose(o) {
      editing.value = false;
      kw.value = '';
      ctx.emit('pick', o ? Number(o.id) : 0);
    }
    // 精确命中（整名 / 工号 / 别名 / 「姓名(工号)」）直接选中：粘贴一步到位
    function tryExact() {
      const k = parseKw(kw.value);
      if (!k.raw) return;
      const byCode = props.options.find(o => String(o.sub || '').toLowerCase() === k.raw);
      if (byCode) return choose(byCode);          // 工号唯一，直接选
      const byAlias = props.options.find(o => {
        const al = String(o.alias || '').toLowerCase();
        return al && al.split(/[,，、;；\s]+/).indexOf(k.raw) !== -1;
      });
      if (byAlias) return choose(byAlias);        // 别名唯一，直接选
      if (filtered.value.length !== 1) return;
      const o = filtered.value[0];
      const nm = String(o.name || '').toLowerCase();
      const sub = String(o.sub || '').toLowerCase();
      if (nm === k.raw || (k.code && (sub === k.code || nm === k.name))) choose(o);
    }
    function onInput(e) { kw.value = e.target.value; tryExact(); }
    function onEnter() {
      if (!editing.value) return;
      const first = filtered.value[0];
      if (first) choose(first);
      else if (props.allowEmpty) choose(null);
    }
    function onEsc() { editing.value = false; kw.value = ''; }
    function onFocus() {
      editing.value = true;
      kw.value = '';                       // 聚焦显示全部候选，而不是只剩当前选中人
      const el = inputEl.value;            // 下方空间不够就向上弹（浮层贴底时常见）
      if (el) {
        const r = el.getBoundingClientRect();
        const below = window.innerHeight - r.bottom - 8;
        dropUp.value = below < 170 && (r.top - 8) > below;
      }
      nextTick(() => { if (inputEl.value) { inputEl.value.focus(); } });
    }
    function onBlur() {
      setTimeout(() => { editing.value = false; kw.value = ''; }, 150);
    }
    return { editing, kw, dropUp, inputEl, dispText, filtered, choose, onInput, onEnter, onEsc, onFocus, onBlur };
  }
};

  setup() {

    function buildMenu(items) {
      const byId = {};

      const parents = items.filter(m => m.parent_id === 0);
      const tree = parents.map(p => ({ ...p, children: items.filter(m => m.parent_id === p.id) }));

    // 分组点击：有子项 → 折叠/展开；无子项（如「首页」自身带路径）→ 直接导航
    function onGroupClick(g) {
      if ((g.children || []).length) toggleGroup(g.id);
      else if (g.path) go(g.path);
    }
    // 切换路由时自动展开当前分组
    watch(route, () => {
      const g = menuTree.value.find(g => groupActive(g));
      if (g && closedGroups.value.has(g.id)) {
        const s = new Set(closedGroups.value); s.delete(g.id);
        closedGroups.value = s;
      }
    });
    function childKey(path) { return (path || '').replace(/^#\/?/, '').split('/')[0]; }
    function go(path) { location.hash = path.startsWith('#') ? path.slice(1) : path; sidebarOpen.value = false; }
    function toggleSidebar() {
      if (window.innerWidth <= 768) { sidebarOpen.value = !sidebarOpen.value; }
      else { collapsed.value = !collapsed.value; localStorage.setItem('sidebarCollapsed', collapsed.value ? '1' : '0'); }
    }
    const roleText = computed(() => ({admin:'管理员',jiaowu:'教务',teacher:'教师',student:'学生'}[user.role] || user.role));
    const pageTitle = computed(() => {
      const all = [...menuTree.value.flatMap(g=>[g,...g.children]), ...leafMenus.value];
      const m = all.find(x => childKey(x.path) === route.value);
      return m ? m.name : '首页';
    });
    const pageComp = computed(() => {
      // 管理员页面路由守卫：非管理员访问直接回工作台
      if (ADMIN_ROUTES.includes(route.value) && AuthState.role !== 'admin') return pages.dashboard;
      const isStaff = AuthState.role === 'admin' || AuthState.role === 'jiaowu';
      if (STAFF_ROUTES.includes(route.value) && !isStaff) return pages.dashboard;
      return pages[route.value] || pages.dashboard;
    });

    function loadMe() { return http.get('/auth/me').then(r => { user.name = r.data.name; user.role = r.data.role; AuthState.role = r.data.role; }); }
    function loadMenus() { return http.get('/menus').then(r => buildMenu(r.data)); }
    function onLogged() {
      token.value = localStorage.getItem('token');
      authMsg.value = '';
      location.hash = '#/dashboard';
      loadMe().then(loadMenus);
    }
    function logout() { localStorage.removeItem('token'); token.value = null; authMsg.value = ''; AuthState.role = ''; location.hash = '#/login'; }
    onMounted(() => {
      window.addEventListener('hashchange', () => { route.value = routeKey(); });
      window.addEventListener('auth-expired', () => {
        authMsg.value = '登录已过期，请重新登录';
        token.value = null;
        AuthState.role = '';
        menuTree.value = []; leafMenus.value = [];
      });
      if (token.value) { loadMe().then(loadMenus); }
      else { location.hash = '#/login'; }
    });
    return { token, authMsg, user, route, menuTree, leafMenus, pageTitle, roleText, pageComp, childKey, go, logout, onLogged, sidebarOpen, collapsed, toggleSidebar, isOpen, toggleGroup, groupActive, onGroupClick };
  }
};

const app = createApp(App);
// 渲染期异常不再静默白屏：控制台留痕，同时提示用户刷新页面
app.config.errorHandler = (err, inst, info) => {
  console.error('[Vue error]', info, err);
  if (!window.__vueErrShown) {
    window.__vueErrShown = true;
    setTimeout(()=>{ alert('页面渲染出错：' + (err && err.message ? err.message : err) + '\n请按 Ctrl+F5 强制刷新后重试。'); }, 0);
  }
};
app.component('login', Login);
app.component('topic-fill', TopicFill);
app.component('person-picker', PersonPicker);
app.mount('#app');
</script>
</body>
</html>
